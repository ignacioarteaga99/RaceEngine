# Construye una región en GitHub (16 GB de RAM, gratis) y la publica en la
# Release «graphs». Un servidor con RACEENGINE_GRAPHS_URL la descarga al usarla.
#
# Uso: pestaña Actions → «Construir región» → Run workflow.
#   · Región del catálogo (santiago_centro, las_condes, …): basta el id.
#   · Ciudad nueva: id inventado (p. ej. c_pucon) + nombre, lat, lon y radio.
name: Construir región
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Id de la región (p. ej. santiago_centro)"
        required: true
      label:
        description: "Solo ciudad nueva: nombre visible"
        required: false
      lat:
        description: "Solo ciudad nueva: latitud del centro"
        required: false
      lon:
        description: "Solo ciudad nueva: longitud del centro"
        required: false
      radius_m:
        description: "Solo ciudad nueva: radio en metros (1500–30000)"
        required: false
        default: "8000"
      elevation:
        description: "Elevación"
        type: choice
        options: [auto, none]
        default: auto

permissions:
  contents: write

# Una construcción a la vez: todas reescriben el mismo manifest.json.
concurrency:
  group: build-region
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Construir
        run: |
          args=("$REGION" --elevation "${{ inputs.elevation }}")
          if [ -n "${{ inputs.lat }}" ]; then
            args+=(--label "${{ inputs.label }}" --lat "${{ inputs.lat }}"
                   --lon "${{ inputs.lon }}" --radius-m "${{ inputs.radius_m }}")
          fi
          python scripts/ci_region.py build "${args[@]}"

      - name: Prueba de humo (genera un 10K y mide la RAM)
        run: python scripts/ci_region.py smoke "$REGION" | tee smoke.txt

      - name: Publicar en la Release «graphs»
        run: |
          gh release view graphs >/dev/null 2>&1 || gh release create graphs \
            --title "Grafos de regiones" --latest=false \
            --notes "Grafos precompilados por el workflow «Construir región». No borrar: el servidor los descarga desde aquí."
          gh release download graphs -p manifest.json -D dist --clobber 2>/dev/null || true
          python scripts/ci_region.py merge dist/manifest.json "dist/$REGION.entry.json"
          gh release upload graphs "dist/$REGION.pkl.gz" dist/manifest.json --clobber

      - name: Resumen
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          e = json.load(open(f"dist/{os.environ['REGION']}.entry.json"))
          print(f"### {e['label']} (`{e['id']}`)\n")
          print("| nodos | .pkl | gzip | RAM construir | RAM generar un 10K | elevación |")
          print("|---|---|---|---|---|---|")
          print(f"| {e['nodes']:,} | {e['size']/1e6:.1f} MB | {e['size_gz']/1e6:.1f} MB "
                f"| {e['build_peak_mb']} MB | {e.get('serve_peak_mb', '?')} MB "
                f"| {'sí' if e['elevation'] else 'no'} |")
          PY
          echo "::notice title=region ${REGION}::$(cat smoke.txt)"
