  $('corrState').innerHTML = `<div class="msg ok" style="margin-top:7px"><b>${
    T('corr_ready')}</b>${T('corr_ready_b')}</div>`;
}

async function corrBuild() {
  const nombre = ($('corrName').value || '').trim();
  if (S.corr.pts.length < 2) return;
  if (!nombre) { $('corrName').focus(); return; }
  $('btnCorrBuild').disabled = true;
  const r = await fetch('/api/regions/corridor', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: nombre, points: S.corr.pts,
                           buffer_m: +$('corrBuf').value }),
  });
  const d = await r.json();
  if (!r.ok) {
    $('corrState').innerHTML = `<div class="msg err" style="margin-top:7px">${
      d.detail || 'Error'}</div>`;
    $('btnCorrBuild').disabled = false;
    return;
  }
  await loadRegions();
  S.corr.regionId = d.id;
  startBuild([d.id], { stateId: 'corrState', btnId: 'btnCorrBuild',
                       alreadyStarted: true, onDone: () => corrAdopt(d.id) });
}

// ══════════════════════════════════════════════════════════════════════════
// Ir a un sitio del mapa
// ══════════════════════════════════════════════════════════════════════════
// Distinto de descargar una región: aquí sólo se navega. Para trazar un trayecto
// de San Vicente de Tagua Tagua a Rapel, primero hay que poder llegar ahí, y
// arrastrando el mapa desde Santiago no se llega.
//
// Acepta coordenadas además de nombres, porque es lo que uno tiene a mano cuando
// las copia de otra herramienta. Se admiten los formatos que la gente pega de
// verdad: «-34.43, -71.07», «-34.43 -71.07» y «-34.43°S 71.07°O».
function parseLatLon(txt) {
  const t = (txt || '').trim().replace(/[°]/g, ' ');
  const m = t.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*([NSns])?\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)\s*([EWOewo])?\s*$/);
  if (!m) return null;
  let la = parseFloat(m[1].replace(',', '.'));
  let lo = parseFloat(m[3].replace(',', '.'));
  if (/[Ss]/.test(m[2] || '')) la = -Math.abs(la);
  if (/[WOwo]/.test(m[4] || '')) lo = -Math.abs(lo);
  if (!isFinite(la) || !isFinite(lo)) return null;
  if (Math.abs(la) > 90 || Math.abs(lo) > 180) return null;
  return { lat: la, lon: lo };
}

function flyTo(lat, lon, zoom) {
  const z = zoom || 13;
  if (map.flyTo) map.flyTo([lat, lon], z, { duration: 0.9 });
  else map.setView([lat, lon], z);
}

// ══════════════════════════════════════════════════════════════════════════
// Salida y meta: buscarlas por nombre e intercambiarlas
// ══════════════════════════════════════════════════════════════════════════
// Pinchar el mapa exige saber dónde cae el sitio ANTES de buscarlo, e invertir
// un trayecto obligaba a borrar los dos puntos y volver a ponerlos en el otro
// orden. Dos casillas y un intercambio es como se hace esto desde hace veinte
// años, y no hay razón para reinventarlo.

const endLabel = (p) => p
  ? `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}` : '';

function paintEnds() {
  // Sólo se sobrescribe lo que no está escrito a mano: si el usuario buscó
  // «San Vicente de Tagua Tagua», ver luego unas coordenadas en su sitio sería
  // perder la información útil.
  if (!S.fromName) $('fromQ').value = endLabel(S.start);
  if (!S.toName) $('toQ').value = endLabel(S.finish);
  $('btnSwapEnds').disabled = !(S.start && S.finish);
}

function clearEnd(cual) {
  if (cual === 'from') {
    S.start = null; S.fromName = '';
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    $('fromQ').value = '';
  } else {
    S.finish = null; S.toName = '';
    if (finishMarker) { map.removeLayer(finishMarker); finishMarker = null; }
    $('toQ').value = '';
  }
  paintEnds(); markDirty(); preflight();
}

function swapEnds() {
  if (!S.start || !S.finish) {
    drawMsg(T('swap_need_two'), 'warn');
    return;
  }
  const a = S.start, b = S.finish;
  const na = S.fromName, nb = S.toName;
  setStart(b.lat, b.lon);
  setFinish(a.lat, a.lon);
  S.fromName = nb; S.toName = na;
  $('fromQ').value = nb || endLabel(S.start);
  $('toQ').value = na || endLabel(S.finish);
  paintEnds();
  // Invertir las puntas es un cambio de problema, no de presentación: la ruta
  // que había describe el trayecto contrario. Dejarla en pantalla sería
  // enseñar un resultado que ya no corresponde a lo que se pide.
  if (S.result) { clearResult(); status(T('swap_done'), null); }
  markDirty(); preflight();
}

let endsTimer = null;
function endsInput(cual) {
  clearTimeout(endsTimer);
  const q = ($(cual === 'from' ? 'fromQ' : 'toQ').value || '').trim();
  if (cual === 'from') S.fromName = q; else S.toName = q;
  if (q.length < 3) { $('endsResults').innerHTML = ''; return; }
  endsTimer = setTimeout(() => endsSearch(cual), 320);
}

async function endsSearch(cual) {
  const q = ($(cual === 'from' ? 'fromQ' : 'toQ').value || '').trim();
  const box = $('endsResults');
  if (q.length < 2) { box.innerHTML = ''; return; }

  // Coordenadas pegadas de cualquier sitio: no hace falta pedirle nada a nadie.
  const coord = parseLatLon(q);
  if (coord) { box.innerHTML = ''; return applyEnd(cual, coord.lat, coord.lon, q); }

  box.innerHTML = `<div class="hint" style="padding:6px">${T('find_searching')}</div>`;
  let d;
  try {
    d = await (await fetch('/api/geocode?any_kind=true&q='
      + encodeURIComponent(q))).json();
  } catch (e) {
    box.innerHTML = `<div class="msg err">${T('go_offline')}</div>`;
    return;
  }
  const hits = d.results || [];
  if (!hits.length) {
    box.innerHTML = `<div class="hint" style="padding:6px">${T('go_none')}</div>`;
    return;
  }
  box.innerHTML = hits.map((h, i) =>
    `<div class="hit" data-i="${i}"><b>${h.name || h.label}</b>
      <span>${(h.display || h.label || '').slice(0, 80)}</span></div>`).join('');
  box.querySelectorAll('.hit').forEach(el => el.onclick = () => {
    const h = hits[+el.dataset.i];
    box.innerHTML = '';
    applyEnd(cual, +h.lat, +h.lon, h.display || h.label || h.name || q);
  });
}

function applyEnd(cual, lat, lon, nombre) {
  if (cual === 'from') {
    S.fromName = nombre;
    setStart(lat, lon);
    $('fromQ').value = nombre;
  } else {
    // Poner un destino ES pedir una ruta punto a punto. Exigir además que el
    // usuario cambie el tipo de recorrido a mano es hacerle decir dos veces lo
    // mismo, y hasta que lo dijera la meta no se aplicaba.
    if ($('shape').value !== 'open') {
      $('shape').value = 'open';
      syncLabels();
      drawMsg(T('to_sets_open'), 'ok');
    }
    S.toName = nombre;
    setFinish(lat, lon);
    $('toQ').value = nombre;
  }
  paintEnds();
  flyTo(lat, lon, Math.max(map.getZoom ? map.getZoom() : 13, 12));
  markDirty(); preflight();
}

async function goSearch() {
  const q = ($('goQ').value || '').trim();
  const box = $('goResults');
  if (q.length < 2) { box.innerHTML = ''; return; }

  const coord = parseLatLon(q);
  if (coord) {
    box.innerHTML = '';
    flyTo(coord.lat, coord.lon, 15);
    updateMapHud(L.latLng(coord.lat, coord.lon));
    return;
  }

  box.innerHTML = `<div class="hint" style="padding:6px">${T('find_searching')}</div>`;
  let d;
  try {
    d = await (await fetch('/api/geocode?any_kind=true&q='
      + encodeURIComponent(q))).json();
  } catch (e) {
    box.innerHTML = `<div class="msg err">${T('go_offline')}</div>`;
    return;
  }
  const hits = d.results || [];
  if (!hits.length) {
    box.innerHTML = `<div class="hint" style="padding:6px">${T('go_none')}</div>`;
    return;
  }
  box.innerHTML = hits.map((h, i) =>
    `<div class="hit" data-i="${i}"><b>${h.name || h.label}</b>
      <span>${(h.display || h.label || '').slice(0, 70)}</span></div>`).join('');
  box.querySelectorAll('.hit').forEach(el => el.onclick = () => {
    const h = hits[+el.dataset.i];
    flyTo(+h.lat, +h.lon, 13);
    // El nombre completo se queda escrito. Vaciar la caja obliga a recordar qué
    // se buscó, y en una lista de homónimos —hay cuatro «San Vicente»— saber
    // cuál se eligió es justamente lo que hace falta.
    $('goQ').value = h.display || h.label || h.name || '';
    box.innerHTML = '';
  });
}

// ══════════════════════════════════════════════════════════════════════════
// Preflight
// ══════════════════════════════════════════════════════════════════════════
let pfTimer = null;
function preflight() {
  if (!S.start) return;
  if ($('shape').value === 'open' && !S.finish) {
    showMessages([{ kind: 'warn', title: T('warning'), body: T('need_finish') }]);
    $('btnGen').disabled = true; return;
  }
  clearTimeout(pfTimer);
  pfTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/preflight', { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildModel()) });
      const d = await r.json();
      if (!r.ok) { showMessages([{ kind: 'err', title: 'Error', body: d.detail }]); return; }
      const msgs = [];
      (d.blocking || []).forEach(b => msgs.push({ kind: 'err',
        title: `${T('infeasible')} · ${b.rule}`, body: b.detail, fix: b.suggested_relaxation }));
      (d.warnings || []).forEach(w => msgs.push({ kind: 'warn', title: T('warning'), body: w }));
      if (!msgs.length) msgs.push({ kind: 'ok', title: T('feasible'),
        body: `${T('verified_in')} ${d.preflight_ms} ms.` });
      showMessages(msgs);
      $('btnGen').disabled = (d.blocking || []).length > 0;
    } catch (e) { /* servidor no disponible */ }
  }, 280);
}

function showMessages(msgs) {
  $('messages').innerHTML = msgs.map((m, i) => `
    <div class="msg ${m.kind}"><b>${m.title}</b>${m.body || ''}
      ${m.fix && Object.keys(m.fix).length
        ? `<button class="fix" data-fix="${i}">${T('apply_fix')}</button>` : ''}</div>`).join('');
  $('messages').querySelectorAll('[data-fix]').forEach(b =>
    b.onclick = () => applyFix(msgs[+b.dataset.fix].fix));
}

function applyFix(fix) {
  if (!fix) return;
  if (fix['geometry.search_radius_max_m'])
    $('radius').value = Math.min(20000, fix['geometry.search_radius_max_m']);
  if (fix['distance.target_m']) $('dist').value = Math.min(45000, fix['distance.target_m']);
  if (fix['distance.tolerance_pct']) $('tol').value = fix['distance.tolerance_pct'];
  if (fix['buffer_m']) {
    S.zones.filter(z => z.behavior === 'mandatory').forEach(z =>
      z.buffer_m = Math.max(z.buffer_m, fix['buffer_m']));
    drawZones();
  }
  syncLabels(); renderZones(); preflight();
}

// ══════════════════════════════════════════════════════════════════════════
// Generación + SSE
// ══════════════════════════════════════════════════════════════════════════
async function generate() {
  if (!S.start) { status(T('ready'), 'ready'); return; }
  if (S.es) { S.es.close(); S.es = null; }
  routeLayer.clearLayers();
  S.visible.clear(); S.shownRoute = null; S.profileOf = null;
  // El importado sobrevive a una nueva generación: es la referencia contra la
  // que se compara, no un resultado más que se tire al regenerar.
  if (S.imported) S.visible.add(IMPORT_ID);
  $('btnGen').disabled = true; $('btnCancel').disabled = false;
  $('statusIcon').innerHTML = '<span class="spin"></span>';
  setProgress(0.02);

  const res = await fetch('/api/generations', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildModel()) });
  const d = await res.json();
  if (!res.ok) { showMessages([{ kind: 'err', title: 'Error', body: d.detail }]); finish(); return; }
  S.gid = d.generation_id;

  const es = new EventSource(d.stream_url); S.es = es;
  const onData = ev => {
    const r = JSON.parse(ev.data);
    S.result = r; renderResult(r); setProgress(r.progress); setTiming(r.elapsed_ms);
    statusK(r.stage);
  };
  es.addEventListener('stage', ev => {
    const r = JSON.parse(ev.data);
    statusK(r.stage); setProgress(r.progress); setTiming(r.elapsed_ms);
  });
  es.addEventListener('recommended', onData);
  es.addEventListener('done', ev => {
    const r = JSON.parse(ev.data);
    S.result = r; renderResult(r); setProgress(1); setTiming(r.elapsed_ms);
    // Con un recorrido importado en pantalla, todo se vuelve a puntuar junto:
    // una escala común es la única forma de que la comparación signifique algo.
    if (S.imported) rescoreAll().then(() => renderNow());
    if (r.status === 'infeasible' && r.infeasibility)
      showMessages((r.infeasibility.blocking || []).map(b => ({
        kind: 'err', title: `${T('infeasible')} · ${b.rule}`, body: b.detail,
        fix: b.suggested_relaxation })));
    statusK(r.status);
    finish();
    // La ruta pasa a formar parte de la carrera abierta: cambiar de pestaña y
    // volver no puede hacerla desaparecer.
    if (S.activeId) { S.dirty = true; renderTabs(); autoSave(120); }
  });
  es.addEventListener('error', ev => {
    try { showMessages([{ kind: 'err', title: 'Error', body: JSON.parse(ev.data).detail }]); }
    catch (e) {}
    finish();
  });
  es.addEventListener('close', () => finish());
  es.onerror = () => { if (es.readyState === 2) finish(); };
}

const STAGES = {
  es: { preflight: 'Verificando factibilidad…', generating: 'Generando circuitos…',
    repairing: 'Insertando zonas obligatorias…', adjusting: 'Ajustando la distancia…',
    seed: 'Primer circuito encontrado.', repaired: 'Zonas obligatorias cubiertas.',
    adjusted: 'Distancia dentro de tolerancia.', improving: 'Mejorando la ruta…',
    improved: 'Ruta mejorada.', converged: 'Listo.', cancelled: 'Detenido. Se muestra lo mejor encontrado.',
    infeasible: 'Sin solución con estas restricciones.',
    manual: 'Trazado a mano (modo creativo).',
    imported: 'Recorrido importado y puntuado con el mismo motor.' },
  en: { preflight: 'Checking feasibility…', generating: 'Generating loops…',
    repairing: 'Inserting mandatory zones…', adjusting: 'Adjusting distance…',
    seed: 'First loop found.', repaired: 'Mandatory zones covered.',
    adjusted: 'Distance within tolerance.', improving: 'Improving the route…',
    improved: 'Route improved.', converged: 'Done.', cancelled: 'Stopped. Showing best found.',
    infeasible: 'No solution with these constraints.',
    manual: 'Hand-drawn (creative mode).',
    imported: 'Imported course, scored with the same engine.' },
};
const stageText = s => (STAGES[S.lang] && STAGES[S.lang][s]) || s;

function finish() {
  if (S.es) { S.es.close(); S.es = null; }
  $('btnGen').disabled = false; $('btnCancel').disabled = true;
  $('statusIcon').innerHTML = '';
}
async function cancel() { if (S.gid) await fetch(`/api/generations/${S.gid}/cancel`, { method: 'POST' }); }
// Se guarda la CLAVE, no el texto: al cambiar de idioma hay que poder re-render.
function status(text, key) { S.statusKey = key || null; $('statusText').textContent = text; }
const statusK = k => status(stageText(k), k);
const setProgress = p => $('prog').firstElementChild.style.width = (p * 100) + '%';
const setTiming = ms => $('timing').textContent = ms ? (ms / 1000).toFixed(1) + ' s' : '';

// ══════════════════════════════════════════════════════════════════════════
// Render
// ══════════════════════════════════════════════════════════════════════════
// El recorrido importado se añade a la lista de rutas visibles. Es la única
// forma de que la regla de doc 06 §4.2 —lo que se enseña junto se puntúa junto—
// se pueda cumplir: si viviera en otra estructura, acabaría con otra escala.
const allRoutes = () => {
  const r = S.result;
  const gen = (r && r.recommended) ? [r.recommended, ...(r.alternatives || [])] : [];
  return S.imported ? [...gen, S.imported.route] : gen;
};

function redrawRoutes(fit) {
  routeLayer.clearLayers();
  const routes = allRoutes();
  let bounds = null;

  // La traza ORIGINAL del fichero, por debajo de todo. Sin ella no hay forma de
  // juzgar si el enganche a la calle es fiel o se ha inventado media manzana.
  if (S.imported && S.showRaw && (S.imported.raw || []).length) {
    const raw = S.imported.raw.map(c => [c[1], c[0]]);
    L.polyline(raw, { color: '#ffffff', weight: 2, opacity: .45,
      dashArray: '2 5', interactive: false }).addTo(routeLayer);
  }

  routes.slice().reverse().forEach((rt, ri) => {
    const i = routes.length - 1 - ri;
    if (!S.visible.has(rt.route_id)) return;
    const imp = rt.route_id === IMPORT_ID;
    const latlngs = rt.coordinates.map(c => [c[1], c[0]]);
    // `interactive:false` a propósito: una polilínea interactiva se queda con el
    // ratón y el mapa deja de recibir `mousemove`, que es justo lo que alimenta la
    // lectura de kilómetro y pendiente bajo el cursor. El tooltip pegajoso que
    // había aquí tapaba esa información en vez de complementarla.
    L.polyline(latlngs, { color: '#0b1220', weight: i === 0 ? 8 : 6, opacity: .5,
      interactive: false }).addTo(routeLayer);
    L.polyline(latlngs, { color: colorOf(rt, i), weight: imp ? 4 : (i === 0 ? 4 : 3),
      opacity: imp ? .95 : (i === 0 ? .95 : .85), interactive: false,
      dashArray: imp ? '9 6' : null }).addTo(routeLayer);
    const b = L.latLngBounds(latlngs);
    bounds = bounds ? bounds.extend(b) : b;
  });
  if (fit && bounds) map.fitBounds(bounds.pad(0.12));
}

function renderRouteList() {
  const routes = allRoutes();
  $('alts').innerHTML = routes.map((rt, i) => {
    const on = S.visible.has(rt.route_id);
    const sel = S.profileOf === rt.route_id;
    const tol = rt.in_tolerance ? '' : `<span class="badge b-bad">${T('outside')}</span>`;
    const miss = rt.mandatory_missing.length
      ? `<span class="badge b-warn">${rt.mandatory_missing.length} ${T('uncovered')}</span>` : '';
    const imp = rt.route_id === IMPORT_ID;
    const nombre = imp ? '<b>' + T('imported_route') + '</b>'
      : (i === 0 ? '<b>' + T('recommended') + '</b>' : T('alternative') + ' ' + i);
    return `<div class="alt ${on ? 'on' : ''}" data-r="${rt.route_id}"
        style="${sel ? 'border-color:var(--accent)' : ''}">
      <div class="sw" style="background:${colorOf(rt, i)};${on ? '' : 'opacity:.25'}"></div>
      <div class="meta ${on ? '' : 'off'}">
        <span>${nombre}${tol}${miss}</span>
        <span>${dist(rt.metrics.distance_m)} · ${rt.global_score.toFixed(1)}</span>
      </div></div>`;
  }).join('') || `<div class="hint">${T('no_routes')}</div>`;

  $('alts').querySelectorAll('[data-r]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.r;
      if (S.visible.has(id)) S.visible.delete(id); else S.visible.add(id);
      if (S.visible.has(id)) S.profileOf = id;                 // su altimetría al frente
      else if (S.profileOf === id) S.profileOf = null;
      renderNow();
    };
    el.ondblclick = () => {                                     // doble clic = aislarla
      S.visible.clear(); S.visible.add(el.dataset.r);
      S.profileOf = el.dataset.r;
      renderNow(true);
    };
  });
}

// Resultado «actual» = lo generado, o el importado si aún no se ha generado
// nada. Importar antes de generar tiene que producir un panel completo.
function currentResult() {
  if (S.result) return S.result;
  if (S.imported) {
    return { recommended: S.imported.route, alternatives: [], stage: 'imported',
             elapsed_ms: 0, log: [], seed: '—', graph_version: '',
             engine_version: '', manual: true };
  }
  return null;
}

function renderNow(fit) {
  const r = currentResult();
  if (!r) { renderRouteList(); redrawRoutes(!!fit); return; }
  renderResult(r, fit);
}

function renderResult(r, forceFit) {
  const rec = r.recommended;
  if (!rec) { $('result').style.display = 'none'; $('placeholder').style.display = 'block'; return; }
  $('result').style.display = 'block'; $('placeholder').style.display = 'none';
  $('stageLabel').textContent = r.manual ? stageText(r.stage)
    : `${stageText(r.stage)} · ${(r.elapsed_ms / 1000).toFixed(1)} s`;

  const isNew = S.shownRoute !== rec.route_id;
  if (isNew) { S.visible.add(rec.route_id); S.shownRoute = rec.route_id; }
  const ids = new Set(allRoutes().map(x => x.route_id));
  [...S.visible].forEach(id => { if (!ids.has(id)) S.visible.delete(id); });
  if (!S.visible.size) S.visible.add(rec.route_id);
  if (!S.profileOf || !ids.has(S.profileOf)) S.profileOf = rec.route_id;
  redrawRoutes(isNew || !!forceFit); renderRouteList();

  // El panel describe la ruta SELECCIONADA, no siempre la recomendada. Con un
  // recorrido importado en pantalla, mirar sus métricas es justo lo que se
  // quiere hacer, y antes había que fiarse de la lista de la izquierda.
  const rt = allRoutes().find(x => x.route_id === S.profileOf) || rec;
  const esImp = rt.route_id === IMPORT_ID;
  $('whichRoute').innerHTML = allRoutes().length > 1
    ? `<span class="badge" style="background:${
        esImp ? IMPORT_COLOR : 'var(--accent)'};color:#04121f">${
        esImp ? T('imported_route') : (rt === rec ? T('recommended')
          : T('alternative') + ' ' + allRoutes().indexOf(rt))}</span>` : '';
  $('scaleNote').textContent = (S.imported && S.result)
    ? T('scale_common') : (esImp || r.manual ? T('scale_absolute') : '');
  renderCompare();

  $('scoreN').textContent = rt.global_score.toFixed(1);
  $('scoreN').style.color = rt.global_score >= 65 ? 'var(--ok)'
    : rt.global_score >= 40 ? 'var(--warn)' : 'var(--bad)';
  $('scoreN').title = (r.manual && !S.result) ? T('d_scale') : '';

  const m = rt.metrics, ix = rt.indices, nz = rt.normalized;
  $('tolBadge').innerHTML =
    `<span class="badge ${rt.in_tolerance ? 'b-ok' : 'b-bad'}">${
      rt.in_tolerance ? T('in_tol') : T('out_tol')}</span>` +
    (rt.mandatory_missing.length ? `<span class="badge b-bad">${
      rt.mandatory_missing.length} ${T('uncovered')}</span>` : '') +
    ((r.manual || esImp) ? '' : `<span class="badge ${r.reproducible ? 'b-ok' : 'b-warn'}"
       title="${r.reproducible ? '' : T('repro_no_hint')}">${
      r.reproducible ? '🔒 ' + T('repro_yes') : '⚠ ' + T('repro_no')}</span>`);

  const target = +$('dist').value, tolM = target * +$('tol').value / 100;
  const problems = [];
  if (!rt.in_tolerance) problems.push(`<div class="msg err"><b>${T('out_tol')} · ${
    fmt(Math.abs(rt.metrics.distance_m - target))} m</b>${dist(rt.metrics.distance_m, 3)} ·
    ${fmt((target - tolM) / 1000, 2)}–${fmt((target + tolM) / 1000, 2)} km</div>`);
  if (rt.mandatory_missing.length) problems.push(`<div class="msg err"><b>${
    T('uncovered')}</b>${rt.mandatory_missing.join(', ')}</div>`);
  if (rt.hard_violations.length) problems.push(`<div class="msg warn">${
    rt.hard_violations.join('; ')}</div>`);
  // Un tope incumplido sin decir DÓNDE se cambia obliga a recorrer once capas
  // buscándolo — y si vive en modo avanzado, ni siquiera está a la vista.
  const donde = whereToFix(rt);
  if (donde.length) problems.push(`<div class="msg warn"><b>${T('where_fix')}</b>${
    donde.join('<br>')}${S.adv ? '' :
      `<button class="fix" id="btnGoAdv">${T('go_adv')}</button>`}</div>`);
  // Fuera de tolerancia Y no reproducible = se acabó el tiempo, no es que no
  // exista solución. Son dos diagnósticos muy distintos y hasta ahora el panel
  // los pintaba igual de rojo.
  if (!rt.in_tolerance && r.reproducible === false) {
    problems.push(`<div class="msg warn"><b>${T('budget_short')}</b>${
      T('budget_short_b')}<button class="fix" id="btnMoreTime">${
      T('more_time')}</button></div>`);
  }
  $('problems').innerHTML = problems.join('');
  if ($('btnGoAdv')) $('btnGoAdv').onclick = () => setAdvanced(true);
  if ($('btnMoreTime')) $('btnMoreTime').onclick = () => {
    $('budget').value = Math.min(90, Math.max(45, +$('budget').value * 2));
    syncLabels(); markDirty();
  };

  const bar = (id, v) => { $('t' + id).textContent = v.toFixed(2); $('f' + id).style.width = (v * 100) + '%'; };
  bar('Fit', nz.fit); bar('Speed', ix.speed); bar('Log', ix.logistics);
  bar('Scen', ix.scenery); bar('Diff', ix.difficulty);

  const conf = c => c === 'reliable' ? ''
    : `<span class="badge ${c === 'partial' ? 'b-warn' : 'b-bad'}">${
        c === 'partial' ? T('partial') : T('low')}</span>`;
  const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  $('metrics').innerHTML =
    kv(T('m_distance'), dist(m.distance_m, 3)) +
    kv(T('m_dev'), (m.distance_error_pct >= 0 ? '+' : '') + m.distance_error_pct.toFixed(2) + ' %') +
    kv(T('m_gain') + conf(m.conf_elevation), fmt(m.gain_m) + ' m') +
    kv(T('m_loss'), fmt(m.loss_m) + ' m') +
    kv(T('m_gradmax'), m.grad_max_pct.toFixed(1) + ' %') +
    kv(T('m_cross'), m.crossings) + kv(T('m_lights'), m.lights) +
    kv(T('m_turns'), m.turns + ' / ' + m.sharp_turns) + kv(T('m_uturns'), m.uturns) +
    kv(T('m_straight'), fmt(m.longest_straight_m) + ' m') +
    kv(T('m_selfx'), m.self_crossings) +
    kv(T('m_encl') + conf(m.conf_logistics), m.enclosed_intersections) +
    (m.spr_m ? kv(T('m_spr') + conf('deferred'), dist(m.spr_m, 3)) +
               kv(T('m_spr_save'), '−' + fmt(m.spr_saving_m) + ' m') : '') +
    kv(T('m_closure_len'), dist(m.closure_len_m, 2)) +
    kv(T('m_closure'), fmt(m.closure_impact / 1000, 1)) +
    (m.min_width_m ? kv(T('m_width') + conf('deferred'), m.min_width_m.toFixed(1) + ' m') +
        kv(T('m_bottleneck'), dist(m.bottleneck_m, 2)) +
        kv(T('m_flow'), fmt(m.flow_per_min) + '/min') +
        (m.field_clear_min ? kv(T('m_clear'), fmt(m.field_clear_min, 1) + ' min') : '')
      : '') +
    kv(T('m_green') + conf(m.conf_scenery), m.green_share_pct.toFixed(1) + ' %') +
    kv(T('m_lit') + conf(m.conf_lit), m.lit_share_pct.toFixed(1) + ' %') +
    kv(T('m_hosp'), dist(m.hosp_prox_m, 2)) +
    kv((isCycling() || isOffroad()) ? T('m_time_bike') : T('m_time'),
       hhmm(m.est_time_min)) +
    ((isCycling() || isOffroad())
      ? kv(isCycling() ? T('m_pace_bike') : T('m_pace_foot'),
           isCycling()
             ? (60 / Math.max(m.assumed_pace_min_km, 0.01)).toFixed(1) + ' ' + uLabel() + '/h'
             : m.assumed_pace_min_km.toFixed(1) + ' min/' + uLabel()) +
        kv(T('m_climbs'), m.climbs) +
        (m.climbs ? kv(T('m_hardest'),
            `${dist(m.hardest_climb_m, 1)} · ${m.hardest_climb_pct.toFixed(1)} %`) : '') +
        kv(T('m_unpaved'), m.unpaved_share_pct.toFixed(1) + ' %')
      : '') +
    certVerdict(m) + capVerdict(m);

  // El motor emite ambos idiomas: cambiar de idioma no obliga a regenerar.
  $('opsFlags').innerHTML = rt.ops_flags.length
    ? rt.ops_flags.map(f => `<div class="msg ${f.severity === 'critical' ? 'err'
        : f.severity === 'warning' ? 'warn' : 'ok'}">${
          (f.message_i18n && f.message_i18n[S.lang]) || f.message}</div>`).join('')
    : `<div class="hint">${T('no_ops')}</div>`;
  const expl = (rt.breakdown.explanation_i18n && rt.breakdown.explanation_i18n[S.lang])
    || rt.breakdown.explanation || [];
  $('expl').innerHTML = expl.map(l => `<li>${l}</li>`).join('');
  renderProfile();

  $('engLog').textContent = (r.log || []).join('\n');
  $('prov').textContent = `seed ${r.seed} · ${r.graph_version} · v${r.engine_version} · ${
    rt.provenance.generator || '—'}`;
}

// ── ¿Dónde se cambia esto? ─────────────────────────────────────────────────
// Se deduce de los VALORES, no del texto del aviso: comparar cadenas traducidas
// para saber qué capa tocar es frágil en cuanto se añade un idioma.
function whereToFix(rt) {
  const m = rt.metrics, out = [];
  const uturn = +$('uturn').value;
  if (uturn > 0 && m.uturns > uturn) out.push(T('fix_uturn'));
  const mc = $('maxCross').value.trim(), ml = $('maxLights').value.trim();
  if (mc !== '' && m.crossings > +mc) out.push(T('fix_cross'));
  if (ml !== '' && m.lights > +ml) out.push(T('fix_lights'));
  const gain = +$('gain').value, grade = +$('grade').value;
  if (gain > 0 && m.gain_m > gain) out.push(T('fix_gain'));
  if (grade > 0 && m.grad_max_pct > grade) out.push(T('fix_grade'));
  return out;
}

// ── Veredictos: la diferencia entre un número y una respuesta ───────────────
// Cuatro cifras sueltas («ancho 6,5 · cuello 4,2 km · flujo 615/min · 4,1 min»)
// no le dicen a un organizador si su carrera cabe. El veredicto sí, y enseña la
// aritmética para que se pueda discutir.
function certVerdict(m) {
  if ($('measurement').value !== 'certified' || !m.spr_m || !m.certified_m) return '';
  const falta = m.certified_m - m.spr_m;          // + = mide corto
  // La certificación NO es simétrica. Pasarse de largo no invalida nada: el
  // recorrido mide un poco más de lo anunciado y punto. Quedarse corto sí, y
  // por un solo metro. Por eso la condición es «llega o no llega», no «cae
  // dentro de la banda de tolerancia»: un −102 m dentro de un ±3 % seguiría
  // siendo un maratón corto, y un maratón corto no es un maratón.
  const ok = falta <= 0;
  return `<div class="verdict ${ok ? 'ok' : 'bad'}">
    <b>${ok ? '✓ ' + T('cert_ok') : '✗ ' + T('cert_no')}</b>
    ${T(ok ? 'cert_body_ok' : 'cert_body_no')
      .replace('{spr}', dist(m.spr_m, 3))
      .replace('{need}', dist(m.certified_m, 3))
      .replace('{gap}', fmt(Math.abs(falta)) + ' m')}</div>`;
}

function capVerdict(m) {
  const n = $('fieldSize').value.trim();
  if (!n || !m.min_width_m) return '';
  const need = m.width_needed_m || 0;
  const holgura = need > 0 ? m.min_width_m / need : 99;
  const cls = holgura >= 2 ? 'ok' : holgura >= 1 ? 'warn' : 'bad';
  const titulo = holgura >= 2 ? T('cap_ok') : holgura >= 1 ? T('cap_tight') : T('cap_bad');
  return `<div class="verdict ${cls}">
    <b>${titulo}</b>
    ${T('cap_body')
      .replace('{n}', fmt(+n))
      .replace('{need}', fmt(need, 1))
      .replace('{have}', fmt(m.min_width_m, 1))
      .replace('{at}', dist(m.bottleneck_m, 2))
      .replace('{min}', fmt(m.field_clear_min, 1))}</div>`;
}

// ── Comparación entre lo generado y lo importado ────────────────────────────
function renderCompare() {
  const box = $('compareBox');
  const gen = S.result && S.result.recommended;
  if (!S.imported) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  $('showRaw').checked = S.showRaw;

  const im = S.imported.route, meta = S.imported.meta || {};
  $('cmpActions').innerHTML = '';
  // Si la traza importada no cabe en la banda configurada, ofrecer adoptar su
  // distancia. Sin esto, importar un 42 K con el panel puesto en 10 K devuelve
  // un score bajísimo que no dice nada del recorrido, solo del desajuste.
  if (!im.in_tolerance) {
    const km = Math.round(im.metrics.distance_m / 100) * 100;
    $('cmpActions').innerHTML = `<button class="fix" id="btnAdopt">${
      T('cmp_adopt').replace('{d}', dist(km, 2))}</button>`;
    $('btnAdopt').onclick = () => {
      $('dist').value = Math.min(45000, Math.max(1000, km));
      syncLabels(); markDirty(); preflight(); rescoreAll();
    };
  }

  if (!gen) { $('cmpTable').innerHTML = ''; return; }
  const filas = [
    ['m_distance', r => dist(r.metrics.distance_m, 2), 'none'],
    ['score', r => r.global_score.toFixed(1), 'max'],
    ['m_gain', r => fmt(r.metrics.gain_m) + ' m', 'min'],
    ['m_cross', r => fmt(r.metrics.crossings), 'min'],
    ['m_lights', r => fmt(r.metrics.lights), 'min'],
    ['m_closure_len', r => dist(r.metrics.closure_len_m, 2), 'min'],
    ['m_time', r => fmt(r.metrics.est_time_min) + ' min', 'none'],
  ];
  const val = { score: r => r.global_score, m_gain: r => r.metrics.gain_m,
    m_cross: r => r.metrics.crossings, m_lights: r => r.metrics.lights,
    m_closure_len: r => r.metrics.closure_len_m };
  $('cmpTable').innerHTML = `<table class="cmp">
    <thead><tr><th></th><th>${T('recommended')}</th><th>${T('imported_route')}</th></tr></thead>
    <tbody>${filas.map(([k, f, mejor]) => {
      let ga = '', gb = '';
      if (mejor !== 'none' && val[k]) {
        const a = val[k](gen), b = val[k](im);
        if (a !== b) {
          const gana = mejor === 'max' ? (a > b ? 'a' : 'b') : (a < b ? 'a' : 'b');
          if (gana === 'a') ga = ' class="win"'; else gb = ' class="win"';
        }
      }
      return `<tr><td>${T(k)}</td><td${ga}>${f(gen)}</td><td${gb}>${f(im)}</td></tr>`;
    }).join('')}</tbody></table>
    <div class="hint" style="margin-top:6px">${T('cmp_note')
      .split('{p}').join(meta.matched_pct).split('{d}').join(meta.deviation_m)}</div>`;
}

// ══════════════════════════════════════════════════════════════════════════
// Perfil de elevación — eje X = distancia (km), eje Y = altitud (m)
// ══════════════════════════════════════════════════════════════════════════
function cumulativeProfile(coords) {
  // Distancia acumulada real sobre el terreno + altitud en cada punto.
  const pts = []; let d = 0;
  for (let i = 0; i < coords.length; i++) {
    if (i > 0) {
      const a = coords[i - 1], b = coords[i];
      const latm = (a[1] + b[1]) / 2 * Math.PI / 180;
      const dx = (b[0] - a[0]) * 111320 * Math.cos(latm);
      const dy = (b[1] - a[1]) * 111320;
      d += Math.hypot(dx, dy);
    }
    pts.push([d, coords[i][2]]);
  }
  return pts;
}

function niceTicks(lo, hi, count) {
  const span = hi - lo || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].find(s => s * mag >= raw) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}

function renderProfile() {
  const routes = allRoutes();
  const rt = routes.find(r => r.route_id === S.profileOf) || routes[0];
  S.profilePts = null;
  if (!rt) { $('profile').innerHTML = ''; $('profileWho').textContent = ''; return; }

  const idx = routes.indexOf(rt);
  const color = PALETTE[idx % PALETTE.length];
  $('profileWho').innerHTML =
    `<span style="display:inline-block;width:12px;height:3px;border-radius:2px;
      background:${color};vertical-align:2px"></span> ` +
    (idx === 0 ? T('recommended') : T('alternative') + ' ' + idx);

  if (rt.metrics.conf_elevation === 'deferred') {
    $('profile').innerHTML = `<div class="hint">${T('no_elev')}</div>`;
    return;
  }

  const pts = cumulativeProfile(rt.coordinates);
  // Márgenes generosos a izquierda y arriba: el rótulo del eje Y vivía encima de
  // la primera marca de altitud. Ahora va en su propia franja.
  const W = 300, H = 150, ML = 40, MR = 8, MT = 22, MB = 30;
  const iw = W - ML - MR, ih = H - MT - MB;
  const maxD = pts[pts.length - 1][0] || 1;
  const es = pts.map(p => p[1]);
  let lo = Math.min(...es), hi = Math.max(...es);
  if (hi - lo < 10) { const c = (hi + lo) / 2; lo = c - 5; hi = c + 5; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;

  const X = d => ML + (d / maxD) * iw;
  const Y = e => MT + ih - ((e - lo) / (hi - lo)) * ih;

  const step = Math.max(1, Math.floor(pts.length / 320));
  let path = '';
  for (let i = 0; i < pts.length; i += step)
    path += `${i ? 'L' : 'M'}${X(pts[i][0]).toFixed(1)},${Y(pts[i][1]).toFixed(1)} `;
  const last = pts[pts.length - 1];
  path += `L${X(last[0]).toFixed(1)},${Y(last[1]).toFixed(1)}`;

  const uf = S.unit === 'mi' ? MI : 1000;
  const yTicks = niceTicks(lo, hi, 4);
  const xTicks = niceTicks(0, toU(maxD), 4);
  const grid = yTicks.map(v =>
    `<line class="grid" x1="${ML}" y1="${Y(v).toFixed(1)}" x2="${W - MR}" y2="${Y(v).toFixed(1)}"/>
     <text x="${ML - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`
  ).join('');
  const xlab = xTicks.map(v =>
    `<line class="grid" x1="${X(v * uf).toFixed(1)}" y1="${MT}"
        x2="${X(v * uf).toFixed(1)}" y2="${MT + ih}"/>
     <text x="${X(v * uf).toFixed(1)}" y="${H - MB + 14}" text-anchor="middle">${
       v % 1 === 0 ? v : v.toFixed(1)}</text>`).join('');

  $('profile').innerHTML = `
    <svg class="chart" id="profSvg" width="${W}" height="${H}" style="display:block">
      <text x="0" y="10" class="axlbl">${T('axis_alt')}</text>
      <text x="${W}" y="10" text-anchor="end" class="axlbl">${
        S.unit === 'mi' ? T('axis_dist').replace('km', 'mi') : T('axis_dist')}</text>
      ${xlab}${grid}
      <path d="${path} L${X(maxD).toFixed(1)},${MT + ih} L${ML},${MT + ih} Z"
            fill="${color}22"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.7"/>
      <line class="axis" x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + ih}"/>
      <line class="axis" x1="${ML}" y1="${MT + ih}" x2="${W - MR}" y2="${MT + ih}"/>
      <g id="profCur" style="display:none">
        <line y1="${MT}" y2="${MT + ih}" stroke="${color}" stroke-width="1"
              stroke-dasharray="3,3"/>
        <circle r="3.5" fill="${color}" stroke="#0b1220" stroke-width="1.5"/>
      </g>
    </svg>
    <div id="profRead" class="profread">&nbsp;</div>
    <div class="kv" style="margin-top:6px"><span>${T('total_gain')}</span>
      <span>+${fmt(rt.metrics.gain_m)} m</span></div>
    <div class="kv"><span>${T('m_loss')}</span><span>−${fmt(rt.metrics.loss_m)} m</span></div>
    <div class="kv"><span>${T('m_gradmax')}</span><span>${rt.metrics.grad_max_pct.toFixed(1)} %</span></div>`;

  // Estado compartido con el hover del mapa: mismo origen de verdad.
  S.profilePts = { pts, maxD, X, Y, MT, ih, ML, iw, routeId: rt.route_id };
  wireProfileHover();
}

function gradientAt(pts, d) {
  // Pendiente local sobre una ventana de ±40 m: menos ruido que dos puntos
  // consecutivos, que sobre un DEM de 30 m es esencialmente aleatorio.
  const WIN = 40;
  let lo = 0, hi = pts.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (pts[m][0] < d) lo = m + 1; else hi = m; }
  let a = lo, b = lo;
  while (a > 0 && d - pts[a][0] < WIN) a--;
  while (b < pts.length - 1 && pts[b][0] - d < WIN) b++;
  const run = pts[b][0] - pts[a][0];
  if (run < 1) return { grade: 0, elev: pts[lo][1] };
  return { grade: 100 * (pts[b][1] - pts[a][1]) / run, elev: pts[lo][1] };
}

function profileReadout(d) {
  const P = S.profilePts;
  if (!P) return '';
  const g = gradientAt(P.pts, d);
  const sign = g.grade >= 0 ? '+' : '';
  return `${fmt(toU(d), 2)} ${uLabel()} · ${fmt(g.elev)} m · ${sign}${g.grade.toFixed(1)} %`;
}

function showProfileCursor(d) {
  const P = S.profilePts, svg = $('profSvg'), cur = $('profCur');
  if (!P || !svg || !cur) return;
  const g = gradientAt(P.pts, d);
  const x = P.X(d), y = P.Y(g.elev);
  cur.style.display = '';
  cur.querySelector('line').setAttribute('x1', x);
  cur.querySelector('line').setAttribute('x2', x);
  cur.querySelector('circle').setAttribute('cx', x);
  cur.querySelector('circle').setAttribute('cy', y);
  const rd = $('profRead');
  if (rd) rd.textContent = profileReadout(d);
}

function hideProfileCursor() {
  const cur = $('profCur'), rd = $('profRead');
  if (cur) cur.style.display = 'none';
  if (rd) rd.innerHTML = '&nbsp;';
  if (routeCursor) { routeLayer.removeLayer(routeCursor); routeCursor = null; }
}

function wireProfileHover() {
  const svg = $('profSvg'), P = S.profilePts;
  if (!svg || !P) return;
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect();
    const px = ev.clientX - r.left;
    const d = Math.max(0, Math.min(P.maxD, (px - P.ML) / P.iw * P.maxD));
    showProfileCursor(d);
    markRouteAt(d, P.routeId);        // sincroniza el punto en el mapa
  };
  svg.onmouseleave = hideProfileCursor;
}

// ══════════════════════════════════════════════════════════════════════════
// Regiones
// ══════════════════════════════════════════════════════════════════════════
// ── Región de trabajo: una o varias comunas ─────────────────────────────────
// Una comuna no es una unidad deportiva. Con una sola cargada, un trazado que
// cruza a la de al lado no es que la evite: es que esas calles no existen para
// el motor, y las métricas salen coherentes sobre un mapa incompleto sin que
// nada lo advierta. Por eso la selección es múltiple y el motor recibe la unión.
const regionId = () => S.regionSel.slice().sort().join('+');
const builtRegions = () => S.regions.filter(r => r.built);
const selectedRegions = () => S.regions.filter(r => S.regionSel.includes(r.id));

async function loadRegions() {
  S.regions = await (await fetch('/api/regions')).json();
  // Selección inicial: la que venga del proyecto guardado, si sigue construida.
  const guardadas = ($('region').value || '').split('+').filter(Boolean);
  let sel = guardadas.filter(id => builtRegions().some(r => r.id === id));
  if (!sel.length) {
    const real = builtRegions().find(r => !r.synthetic);
    const primera = real || builtRegions()[0];
    sel = primera ? [primera.id] : [];
  }
  setRegionSel(sel, { silent: true });
  renderRegionPick();
  onRegion();
}

function renderRegionPick() {
  const built = builtRegions();
  const grupos = [...new Set(built.map(r => r.group || 'Otros'))];
  $('regionPick').innerHTML = built.length ? grupos.map(g =>
    `<div class="pickgroup">${g}</div>` +
    built.filter(r => (r.group || 'Otros') === g).map(r => `
      <label class="pickrow">
        <input type="checkbox" data-reg="${r.id}" ${
          S.regionSel.includes(r.id) ? 'checked' : ''}>
        <span>${r.label}</span>
        <span class="tag">${r.synthetic ? T('synthetic_tag')
          : fmt(r.nodes || 0) + ' n'}</span>
      </label>`).join('')).join('')
    : `<div class="hint" style="padding:6px">${T('no_regions')}</div>`;
  $('regionPick').querySelectorAll('[data-reg]').forEach(i => {
    i.onchange = () => {
      const ids = [...$('regionPick').querySelectorAll('[data-reg]:checked')]
        .map(x => x.dataset.reg);
      if (!ids.length) { i.checked = true; return; }   // nunca cero regiones
      setRegionSel(ids);
      markDirty(); preflight();
    };
  });
}

function setRegionSel(ids, opts) {
  S.regionSel = [...new Set(ids)].sort();
  $('region').value = regionId();
  if (!(opts && opts.silent)) { renderRegionPick(); onRegion(); }
}

// Cifras del grafo YA unido. Sumar las de cada comuna mentiría: en las costuras
// hay nodos compartidos, y prometer precisión inventada es peor que esperar.
async function composeRegion() {
  const ids = S.regionSel.slice();
  if (!ids.length) return;
  const clave = regionId();
  S.composing = true;
  paintRegionInfo();
  try {
    const res = await fetch('/api/regions/compose', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids }),
    });
    const d = await res.json();
    if (regionId() !== clave) return;                  // la selección ya cambió
    S.composed = res.ok ? d : { error: d.detail || 'error' };
  } catch (e) {
    S.composed = { error: String(e) };
  } finally {
    if (regionId() === clave) { S.composing = false; paintRegionInfo(); }
  }
}

// ── Perímetro del área de trabajo ──────────────────────────────────────────
// Ver hasta dónde llega lo descargado explica de un vistazo por qué un recorrido
// se corta o por qué un punto queda inalcanzable. Pero tenerlo siempre encima
// estorba al trazar, así que se enseña o se esconde SIN dejar de estar activa:
// el perímetro es información, no la selección.
function drawArea() {
  if (S.areaLayer) { map.removeLayer(S.areaLayer); S.areaLayer = null; }
  if (!S.showArea) return;
  const sel = selectedRegions();
  if (!sel.length) return;
  const g = L.layerGroup();
  sel.forEach(r => {
    if ((r.corridor || []).length >= 2 && r.buffer_m) {
      // Una franja se dibuja como franja; un círculo alrededor de su centro no
      // se parecería en nada a lo que de verdad se descargó.
      corridorRing(r.corridor, r.buffer_m).then(anillo => {
        if (!anillo || !S.showArea || !S.areaLayer) return;
        L.polyline([...anillo.map(c => [c[0], c[1]]), [anillo[0][0], anillo[0][1]]],
          { color: '#7c5cff', weight: 2, opacity: .8, dashArray: '7 5',
            interactive: false }).addTo(S.areaLayer);
      }).catch(() => {});
    } else {
      L.circle([r.lat, r.lon], { radius: r.radius_m, color: '#7c5cff', weight: 2,
        opacity: .8, dashArray: '7 5', fill: false, interactive: false }).addTo(g);
    }
  });
  S.areaLayer = g.addTo(map);
}

const _ringCache = {};
async function corridorRing(pts, buffer) {
  const clave = JSON.stringify([pts, buffer]);
  if (_ringCache[clave]) return _ringCache[clave];
  try {
    const r = await fetch('/api/regions/corridor/preview', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label: 'x', points: pts, buffer_m: buffer }),
    });
    const d = await r.json();
    _ringCache[clave] = d.ring || null;
    return _ringCache[clave];
  } catch (e) { return null; }
}

function paintRegionInfo() {
  const badge = l => l === 'reliable' ? '🟢' : l === 'partial' ? '🟡' : '🔴';
  const sel = selectedRegions();
  const c = S.composed;
  if (S.composing) {
    $('regionInfo').innerHTML = `<span class="hint">${T('composing')}</span>`;
    return;
  }
  if (c && c.error) {
    $('regionInfo').innerHTML = `<span style="color:var(--bad)">${c.error}</span>`;
    return;
  }
  const cab = sel.length > 1
    ? `<b>${T('region_n').replace('{n}', sel.length)}</b> · ${
        sel.map(r => r.label).join(' + ')}<br>` : '';
  const cifras = c
    ? `${fmt(c.nodes)} nodos · ${fmt(c.edges)} aristas<br>` +
      Object.entries(c.coverage || {}).map(([k, v]) =>
        `${badge(v.level)} ${k} ${v.pct}%`).join(' · ')
    : '—';
  // Un mapa en trozos no parece un error: parece un mapa. Y el usuario lo
  // descubre cuando el recorrido se corta a media calle.
  const con = (c && c.coverage && c.coverage.connectivity) || null;
  const roto = (con && con.level !== 'reliable')
    ? `<div class="msg warn" style="margin:7px 0"><b>${T('graph_split')}</b>${
        fill('graph_split_b', {n: con.components, p: con.pct})}</div>` : '';
  const propia = sel.length === 1 && sel[0].custom
    ? `<br><a href="#" id="rmCity" style="color:var(--bad)">${T('find_del')}</a>` : '';
  $('regionInfo').innerHTML = cab + cifras + roto + propia;
  const rm = $('rmCity');
  if (rm) rm.onclick = ev => { ev.preventDefault(); removeCity(sel[0].id, sel[0].label); };
}

function onRegion() {
  const sel = selectedRegions();
  if (!sel.length) return;
  const r = sel[0];
  // OJO: no se corta el sondeo si hay una descarga en curso. `applyLang` llama a
  // `onRegion`, así que cambiar de idioma mientras se descargaba una ciudad
  // mataba el seguimiento y la barra desaparecía — la descarga seguía por detrás
  // y el usuario se quedaba mirando una pantalla que no decía nada.
  if (!S.build) clearInterval(S.buildPoll);
  // Al cambiar de ciudad hay que IR a la ciudad. Antes solo se recentraba si aún
  // no había salida, así que elegir Londres dejaba el mapa en Santiago y parecía
  // que la región no se había aplicado. El zoom sale del radio de la región para
  // que quepa entera: 20 km de radio no se ven con el mismo zoom que 7.
  const id = regionId();
  if (S.lastRegion !== id) {
    S.lastRegion = id;
    if (sel.length > 1) {
      // Varias comunas: encuadrar la unión, no volar a una de ellas.
      const b = L.latLngBounds(sel.flatMap(x => {
        const dlat = x.radius_m / 111320;
        const dlon = x.radius_m / (111320 * Math.cos(x.lat * Math.PI / 180));
        return [[x.lat - dlat, x.lon - dlon], [x.lat + dlat, x.lon + dlon]];
      }));
      map.fitBounds(b.pad(0.02));
    } else {
      const z = r.radius_m >= 18000 ? 11.5 : r.radius_m >= 11000 ? 12 : 13;
      if (map.flyTo) map.flyTo([r.lat, r.lon], z, { duration: 0.9 });
      else map.setView([r.lat, r.lon], z);
    }
  } else if (!S.start) {
    map.setView([r.lat, r.lon], 13);
  }

  // Mezclar la ciudad sintética con datos reales produce un grafo que no es ni
  // una cosa ni la otra. Se avisa; no se impide, porque para probar sirve.
  const sint = sel.filter(x => x.synthetic);
  $('regionWarn').innerHTML =
    (sint.length ? `<div class="msg warn" style="margin:6px 0"><b>${
        T('synthetic_title')}</b>${T('synthetic_body')}</div>` : '') +
    (sint.length && sel.length > sint.length
      ? `<div class="msg warn" style="margin:6px 0">${T('mix_warn')}</div>` : '');
  S.composed = null;
  paintRegionInfo();
  composeRegion();
  drawArea();

  const unbuilt = S.regions.filter(x => !x.synthetic && !x.built);
  const grupos = [...new Set(S.regions.filter(x => !x.synthetic).map(x => x.group))];
  $('regionBuild').innerHTML = (r.synthetic || unbuilt.length) ? `
    <div style="margin-top:9px">
      <label style="margin:0 0 5px">${T('build_region')}</label>
      <div class="picklist" id="buildPick">
        ${grupos.map(g => `<div class="pickgroup">${g}</div>` +
          S.regions.filter(x => !x.synthetic && x.group === g).map(x => `
            <label class="pickrow ${x.built ? 'done' : ''}">
              <input type="checkbox" value="${x.id}" ${x.built ? 'disabled' : ''}>
              <span>${x.label}</span>
              <span class="tag">${x.built ? '✓' : (x.radius_m / 1000).toFixed(0) + ' km'}</span>
            </label>`).join('')).join('')}
      </div>
      <div class="btns" style="margin-top:7px">
        <button id="btnBuild" style="flex:1">${T('build_btn')}</button>
        <button id="btnPickNone">${T('pick_none')}</button>
      </div>
      <div class="hint" id="pickHint"></div>
      <div class="hint">${T('build_hint')}</div>
      <div id="buildState"></div>
    </div>` : '';
  const bb = $('btnBuild');
  if (bb) {
    const marcadas = () => [...document.querySelectorAll(
      '#buildPick input:checked')].map(i => i.value);
    const refresca = () => {
      const n = marcadas().length;
      bb.textContent = n > 1 ? T('build_btn_n').replace('{n}', n) : T('build_btn');
      bb.disabled = n === 0 || !!S.build;
      $('pickHint').textContent = n > 1 ? T('build_queue_hint') : '';
    };
    document.querySelectorAll('#buildPick input').forEach(i => i.onchange = refresca);
    $('btnPickNone').onclick = () => {
      document.querySelectorAll('#buildPick input').forEach(i => { i.checked = false; });
      refresca();
    };
    bb.onclick = () => startBuild(marcadas());
    refresca();
  }
  // Si había una descarga en marcha, se vuelve a pintar en el contenedor recién
  // creado y el sondeo continúa donde estaba.
  if (S.build) {
    if (S.build.last) paintBuild(S.build.last);
    if (!S.buildPoll) startBuild(S.build.regions || [S.build.regionId],
      Object.assign({}, S.build, { alreadyStarted: true }));
  }
  if (!S.start) setStart(r.lat, r.lon);
}

// `stateId` y `btnId` se parametrizan para que el buscador de ciudades reutilice
// exactamente el mismo seguimiento de progreso que el desplegable curado, en vez
// de tener dos barras que se comportan distinto.
function paintBuild(st) {
  const b = S.build;
  if (!b) return;
  const box = $(b.stateId);
  if (!box) return;
  const pct = st.pct || 0;
  const eta = st.eta_s != null
    ? ` · ${T('eta')} ${st.eta_s > 90 ? Math.round(st.eta_s / 60) + ' min' : st.eta_s + ' s'}` : '';
  const q = b.queue || {};
  const total = (b.regions || [b.regionId]).length;
  const restan = (q.pending || []).length;
  const idx = total - restan;
  const nombre = (S.regions.find(x => x.id === b.regionId) || {}).label || b.regionId;
  const cabecera = total > 1
    ? `${T('building')} ${idx}/${total} · ${nombre} · ${pct.toFixed(0)} %`
    : `${T('building')} ${pct.toFixed(0)} %`;
  box.innerHTML = `
    <div class="msg warn" style="margin-top:7px">
      <b>${cabecera}</b>
      <div class="pbar"><div style="width:${pct}%"></div></div>
      <div class="pmeta"><span>${st.message || ''}</span>
        <span>${st.elapsed ? Math.round(st.elapsed) + ' s ' + T('elapsed') : ''}${eta}</span></div>
      ${restan ? `<div style="margin-top:5px;color:var(--tx3);font-size:11px">${
        T('build_pending').replace('{n}', restan)}</div>` : ''}
    </div>` + ((st.log || []).length ? `<div class="buildlog">${st.log.slice(-8).join('\n')}</div>` : '');
}

async function startBuild(regions, opts) {
  const lista = Array.isArray(regions) ? regions.filter(Boolean) : [regions].filter(Boolean);
  if (!lista.length) return;
  const o = opts || {};
  const stateId = o.stateId || 'buildState';
  const btnId = o.btnId || 'btnBuild';
  const $s = () => $(stateId);
  const $b = () => $(btnId);
  S.build = { regionId: lista[0], regions: lista, stateId, btnId,
              last: (S.build && S.build.last) || null };
  if (o.onDone) S.build.onDone = o.onDone;
  if ($b()) $b().disabled = true;
  if (!o.alreadyStarted) {
    await fetch('/api/regions/build-batch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ regions: lista }),
    });
  }
  clearInterval(S.buildPoll);
  S.buildPoll = setInterval(async () => {
    const q = await (await fetch('/api/regions/build-queue')).json();
    if (q.active) {
      S.build.regionId = q.current || S.build.regionId;
      S.build.queue = q;
      S.build.last = q.current_state || {};
      paintBuild(S.build.last);
      return;
    }
    // La cola se vació: hay que informar del conjunto, no de la última región.
    clearInterval(S.buildPoll); S.buildPoll = null;
    const hechas = lista.filter(r => (q.done || []).includes(r));
    const fallidas = lista.filter(r => (q.failed || []).includes(r));
    S.build = null;
    // En cuanto hay datos reales, la ciudad sintética deja de ser la región de
    // trabajo. Quedarse con «demo» marcado después de descargar tres comunas era
    // la forma más rápida de acabar midiendo sobre una ciudad que no existe.
    if (hechas.length) {
      const reales = S.regionSel.filter(id =>
        !(S.regions.find(x => x.id === id) || {}).synthetic);
      S.regionSel = [...new Set([...reales, ...hechas])];
      $('region').value = regionId();
    }
    await loadRegions();
    if ($s()) {
      $s().innerHTML =
        (hechas.length ? `<div class="msg ok" style="margin-top:7px"><b>${
          T('build_done')}</b>${hechas.length} ${T('build_done_n')}</div>` : '') +
        (fallidas.length ? `<div class="msg err" style="margin-top:7px"><b>${
          T('build_failed')}</b>${fallidas.join(', ')}</div>` : '');
    }
    if ($b()) $b().disabled = false;
    if (hechas.length) {
      // Los puntos que se marcaron para DEFINIR la franja ya cumplieron su
      // función: dejarlos encima confunde el trayecto de referencia con el
      // recorrido. Se limpian y se pasa a enseñar el perímetro de lo que de
      // verdad se descargó — salvo que el usuario lo tenga apagado.
      const eraCorredor = hechas.some(id =>
        ((S.regions.find(x => x.id === id) || {}).corridor || []).length >= 2);
      if (eraCorredor && S.corr.pts.length) {
        corrClear();
        $('corrName').value = '';
      }
      drawArea();
      preflight();
    }
    if (hechas.length && typeof o.onDone === 'function') o.onDone();
  }, 2000);
}

// ══════════════════════════════════════════════════════════════════════════
// Buscador de ciudades — cualquier lugar, no solo el catálogo curado
// ══════════════════════════════════════════════════════════════════════════
// El catálogo de `REGIONS` es un atajo, no un límite. Aquí se busca en
// OpenStreetMap (Nominatim), se elige el radio y se descarga con el mismo
// pipeline y la misma barra de progreso que una región curada.
async function searchCity() {
  const q = $('cityQ').value.trim();
  if (q.length < 2) return;
  $('cityResults').innerHTML = `<div class="hint">${T('find_searching')}</div>`;
  $('cityPick').style.display = 'none';
  S.cityHit = null;
  let d;
  try {
    d = await (await fetch(`/api/geocode?q=${encodeURIComponent(q)}`)).json();
  } catch (e) {
    d = { results: [], error: String(e) };
  }
  if (d.error && !(d.results || []).length) {
    $('cityResults').innerHTML = `<div class="msg err">${T('find_offline')}</div>`;
    return;
  }
  const hits = d.results || [];
  if (!hits.length) {
    $('cityResults').innerHTML = `<div class="hint">${T('find_none')}</div>`;
    return;
  }
  S.cityHits = hits;
  $('cityResults').innerHTML = hits.map((h, i) => {
    const have = S.regions.find(r => r.id === h.id && r.built);
    return `<div class="hit" data-hit="${i}">
      <b>${h.label}${have ? ' ✓' : ''}</b>
      <span>${h.display}</span>
      <span>· ${h.kind} · ~${(h.radius_m / 1000).toFixed(1)} km${
        have ? ' · ' + T('find_exists') : ''}</span>
    </div>`;
  }).join('');
  $('cityResults').querySelectorAll('[data-hit]').forEach(el => el.onclick = () => {
    pickCity(hits[+el.dataset.hit]);
    $('cityResults').querySelectorAll('.hit').forEach(x => x.classList.toggle('on', x === el));
  });
}

function pickCity(h) {
  S.cityHit = h;
  $('cityPick').style.display = 'block';
  $('cityR').value = Math.max(2000, Math.min(25000, h.radius_m));
  syncCityRadius();
  // Enseñar dónde cae, para que se vea si Nominatim acertó antes de descargar.
  if (map.flyTo) map.flyTo([h.lat, h.lon], 12, { duration: 0.8 });
  else map.setView([h.lat, h.lon], 12);
}

function syncCityRadius() {
  $('vCityR').textContent = fmt(toU(+$('cityR').value), 1) + ' ' + uLabel();
}

async function buildCity() {
  const h = S.cityHit;
  if (!h) return;
  $('btnCityBuild').disabled = true;
  $('cityState').innerHTML = '';
  const res = await fetch('/api/regions/custom', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: h.id, label: h.label, lat: h.lat, lon: h.lon,
                           radius_m: +$('cityR').value }),
  });
  const d = await res.json();
  if (!res.ok) {
    $('btnCityBuild').disabled = false;
    $('cityState').innerHTML = `<div class="msg err" style="margin-top:7px">${
      d.detail || 'error'}</div>`;
    return;
  }
  await loadRegions();
  // La descarga ya la arrancó el propio endpoint: aquí solo se sigue el progreso.
  startBuild([d.id], { stateId: 'cityState', btnId: 'btnCityBuild',
                     alreadyStarted: true });
}

async function removeCity(regionId, name) {
  if (!confirm(T('find_del_confirm').replace('{n}', name))) return;
  await fetch(`/api/regions/custom/${regionId}`, { method: 'DELETE' });
  S.lastRegion = null;
  await loadRegions();
  onRegion(); preflight();
}

// ══════════════════════════════════════════════════════════════════════════
// Proyectos (carreras)
// ══════════════════════════════════════════════════════════════════════════
// Cada carrera es un espacio de trabajo aislado: su salida, sus zonas y sus
// ajustes. `captureState` / `applyState` son el contrato con el backend, que
// guarda el estado como un blob opaco — así añadir un control a la UI no obliga
// a migrar el esquema del servidor.
const STATE_FIELDS = ['region', 'dist', 'tol', 'shape', 'reuse', 'elevOn', 'gain',
  'grade', 'flatter', 'radius', 'smooth', 'uturn', 'maxCross', 'maxLights',
  'private', 'tunnels', 'wide', 'closures', 'parks', 'objective', 'budget', 'repro',
  'measurement', 'laps', 'fieldSize',
  'zoneRadius'];

function captureState() {
  const f = {};
  STATE_FIELDS.forEach(k => {
    const el = $(k); if (el) f[k] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return {
    fields: f, start: S.start, finish: S.finish, zones: S.zones, unit: S.unit,
    // La ruta generada forma parte del proyecto: cambiar de pestaña no puede
    // hacerla desaparecer. Solo se pierde si el usuario regenera.
    result: (S.result && !S.result.manual) ? slimResult(S.result)
      : (S.draw.saved ? slimResult(S.draw.saved) : null),
    // El trazado manual también pertenece a la carrera. Se guardan los índices
    // de nodo y arista, no la geometría: el servidor la reconstruye exacta.
    draw: S.draw.nodes.length ? {
      nodes: S.draw.nodes, edges: S.draw.edges,
      legs: S.draw.legs, closed: S.draw.closed,
    } : null,
    // El recorrido importado es parte de la carrera: comparar con el del año
    // pasado no puede perderse al cambiar de pestaña.
    imported: S.imported ? {
      route: slimRoute(S.imported.route), meta: S.imported.meta,
      name: S.imported.name, raw: thinPts(S.imported.raw, 1200),
    } : null,
    regions: S.regionSel.slice(),
    discipline: S.discipline, distMode: S.distMode,
  };
}

const thinPts = (a, max) => {
  if (!a || a.length <= max) return a || [];
  const step = Math.ceil(a.length / max);
  const out = a.filter((_, i) => i % step === 0);
  if (out[out.length - 1] !== a[a.length - 1]) out.push(a[a.length - 1]);
  return out;
};

function slimResult(r) {
  // Se conserva todo lo que el panel necesita, pero las geometrías se
  // submuestrean si son gigantescas: un 42 K son ~5.000 puntos por ruta y
  // guardar cinco rutas completas engorda el JSON sin aportar precisión visible.
  return {
    ...r,
    recommended: slimRoute(r.recommended),
    alternatives: (r.alternatives || []).map(slimRoute),
  };
}

function slimRoute(rt) {
  const MAXP = 2500;
  if (!rt) return rt;
  const c = rt.coordinates || [];
  if (c.length <= MAXP) return rt;
  return { ...rt, coordinates: thinPts(c, MAXP) };
}

function applyState(st) {
  if (!st) return;
  Object.entries(st.fields || {}).forEach(([k, v]) => {
    const el = $(k); if (!el) return;
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  });
  // La región puede ser compuesta («las_condes+nunoa»). Se restauran solo las
  // partes que sigan construidas: un proyecto de otra máquina puede citar una
  // comuna que aquí nunca se descargó.
  if (st.discipline) { S.discipline = st.discipline; renderDisciplines();
    document.body.classList.toggle('cycling', isCycling()); loadPresets(); }
  S.distMode = st.distMode === 'range' ? 'range' : 'target';
  const pedidas = st.regions || ($('region').value || '').split('+').filter(Boolean);
  const vivas = pedidas.filter(id => builtRegions().some(x => x.id === id));
  if (vivas.length) setRegionSel(vivas, { silent: true });
  $('region').value = regionId();

  S.zones = (st.zones || []).map(z => ({ ...z }));   // copia: nunca se comparte
  S.start = st.start ? { ...st.start } : null;
  S.finish = st.finish ? { ...st.finish } : null;
  if (st.unit) S.unit = st.unit;
  if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
  if (finishMarker) { map.removeLayer(finishMarker); finishMarker = null; }
  if (S.start) setStart(S.start.lat, S.start.lon);
  if (S.finish) setFinish(S.finish.lat, S.finish.lon);
  drawZones(); renderZones(); syncLabels();
  clearResult();
  renderRegionPick(); onRegion();
  if (st.imported && st.imported.route) {
    S.imported = { route: st.imported.route, raw: st.imported.raw || [],
                   meta: st.imported.meta || {}, name: st.imported.name || '' };
    S.imported.route.route_id = IMPORT_ID;
    S.visible.add(IMPORT_ID);
  }
  if (st.result && st.result.recommended) {
    S.result = st.result;
    renderResult(st.result);
    statusK(st.result.status || 'converged');
  } else {
    renderNow();
  }
  if (st.draw && (st.draw.nodes || []).length) {
    S.draw.nodes = st.draw.nodes.slice();
    S.draw.edges = (st.draw.edges || []).slice();
    S.draw.legs = (st.draw.legs || []).slice();
    S.draw.closed = !!st.draw.closed;
    if (S.draw.on) {
      S.draw.saved = S.result;
      drawPost('/api/draw/state', { nodes: S.draw.nodes, edges: S.draw.edges })
        .then(r => { if (r && r.route) drawApply(r); }).catch(() => {});
    }
  }
  preflight();
}

function markDirty() {
  if (!S.dirty) { S.dirty = true; renderTabs(); }
  autoSave();
}

function renderTabs() {
  const tabs = S.open.map(p => {
    const on = p.id === S.activeId;
    const name = p.id ? p.name : T('scratch');
    return `<div class="tab ${on ? 'on' : ''}" data-tab="${p.id || ''}">
      ${on && S.dirty ? '<span class="dirty" title="' + T('unsaved') + '"></span>' : ''}
      <span>${name}</span>
      <span class="x" data-close="${p.id || ''}">×</span></div>`;
  }).join('');
  $('tabs').innerHTML = tabs + `
    <div class="tabtools">
      <button data-act="gallery">🗂 ${T('gallery')}</button>
      <button data-act="new">${T('new_project')}</button>
      <button data-act="save">${T('save')}</button>
      <button data-act="rename">${T('rename')}</button>
      <button data-act="clear">${T('clear_all')}</button>
      <button data-act="delete" class="danger">${T('del')}</button>
    </div>`;

  $('tabs').querySelectorAll('[data-tab]').forEach(el => el.onclick = e => {
    if (e.target.dataset.close !== undefined) return;
    switchTo(el.dataset.tab || null);
  });
  $('tabs').querySelectorAll('[data-close]').forEach(el => el.onclick = e => {
    e.stopPropagation(); closeTab(el.dataset.close || null);
  });
  $('tabs').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    ({ new: newProject, save: saveProject, rename: renameProject,
       delete: deleteProject, clear: clearAll, gallery: openGallery })[b.dataset.act]();
  });
}

async function loadProjects() {
  S.projects = await (await fetch('/api/projects')).json();
  if (!S.open.length) S.open = [{ id: null, name: T('scratch') }];
  renderTabs(); renderSaved();
}

function renderSaved() {
  const el = $('savedList');
  if (!el) return;
  if (!S.projects.length) {
    el.innerHTML = `<div class="hint">${T('no_zones').replace('zona', 'carrera')
      .replace('zones', 'races')}</div>`;
    return;
  }
  el.innerHTML = S.projects.map(p => `
    <div class="zone" data-open="${p.id}" style="cursor:pointer">
      <div class="dot" style="background:${
        p.id === S.activeId ? 'var(--accent)' : 'var(--tx3)'}"></div>
      <div class="nm" title="${p.description || ''}">${p.name}</div>
    </div>`).join('');
  el.querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => openSaved(b.dataset.open));
}

function askName(title, name, desc, onOk) {
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="box">
    <h3>${title}</h3>
    <label>${T('p_name')}</label><input type="text" id="mName" value="${name || ''}">
    <label style="margin-top:9px">${T('p_desc')}</label>
    <input type="text" id="mDesc" value="${desc || ''}">
    <div class="btns" style="margin-top:14px;justify-content:flex-end">
      <button id="mCancel">${T('p_cancel')}</button>
      <button id="mOk" class="primary">${T('p_create')}</button>
    </div></div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('#mCancel').onclick = close;
  wrap.querySelector('#mOk').onclick = () => {
    const n = wrap.querySelector('#mName').value.trim();
    if (!n) return;
    close(); onOk(n, wrap.querySelector('#mDesc').value.trim());
  };
  const inp = wrap.querySelector('#mName');
  inp.focus(); inp.select();
  inp.onkeydown = e => { if (e.key === 'Enter') wrap.querySelector('#mOk').click(); };
  wrap.onclick = e => { if (e.target === wrap) close(); };
}

function newProject() {
  askName(T('p_new_title'), '', '', async (name, desc) => {
    await flushSave();
    // Una carrera nueva nace EN BLANCO. Capturar el estado actual antes de
    // resetear la habría creado heredando la configuración de la anterior, que
    // es justo lo contrario de "cada carrera es un proyecto independiente".
    resetAll(true);
    S.start = null; S.finish = null;
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    if (finishMarker) { map.removeLayer(finishMarker); finishMarker = null; }
    const region = selectedRegions()[0];
    if (region) setStart(region.lat, region.lon);

    const r = await fetch('/api/projects', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: desc, state: captureState() }) });
    const p = await r.json();
    S.open.push({ id: p.id, name: p.name });
    S.activeId = p.id; S.dirty = false;
    await loadProjects();
  });
}

// El guardado automático debe fijar la carrera y el estado EN EL MOMENTO de
// programarse, no al dispararse: si el usuario cambia de pestaña entretanto, el
// temporizador escribiría el estado nuevo sobre la carrera vieja (o al revés).
// Era exactamente lo que hacía desaparecer la ruta al cambiar de pestaña.
let saveTimer = null;
let pendingSave = null;

async function persistState(pid, state) {
  await fetch(`/api/projects/${pid}`, { method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ state }) });
  if (pid === S.activeId) { S.dirty = false; renderTabs(); }
}

function autoSave(delay = 700) {
  if (!S.activeId) return;
  const pid = S.activeId, state = captureState();
  clearTimeout(saveTimer);
  pendingSave = { pid, state };
  saveTimer = setTimeout(() => {
    const job = pendingSave; pendingSave = null; saveTimer = null;
    if (job) persistState(job.pid, job.state);
  }, delay);
}

// Antes de cambiar o cerrar pestaña hay que vaciar la cola: si no, el guardado
// pendiente llegaría tarde y con el contexto equivocado.
async function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  const job = pendingSave; pendingSave = null;
  if (job) await persistState(job.pid, job.state);
}

async function saveProject() {
  if (!S.activeId) {
    askName(T('p_new_title'), '', '', async (name, desc) => {
      const r = await fetch('/api/projects', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description: desc, state: captureState() }) });
      const p = await r.json();
      const scratch = S.open.find(x => !x.id);
      if (scratch) { scratch.id = p.id; scratch.name = p.name; }
      S.activeId = p.id; S.dirty = false;
      await loadProjects();
      status(T('p_saved'));
    });
    return;
  }
  await fetch(`/api/projects/${S.activeId}`, { method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ state: captureState() }) });
  S.dirty = false; renderTabs(); status(T('p_saved'));
}

function renameProject() {
  if (!S.activeId) return saveProject();
  const cur = S.projects.find(p => p.id === S.activeId) || {};
  askName(T('rename'), cur.name, cur.description, async (name, desc) => {
    await fetch(`/api/projects/${S.activeId}`, { method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: desc }) });
    const tab = S.open.find(x => x.id === S.activeId);
    if (tab) tab.name = name;
    await loadProjects();
  });
}

// Vaciar del todo: el mapa como recién abierto, pero SIN tocar la región ni la
// disciplina. Volver a elegir comuna y deporte después de un borrado es un peaje
// que no pidió nadie: lo que se quiere tirar es el trabajo, no el contexto.
function clearAll(silencioso) {
  if (!silencioso) {
    const hay = S.zones.length || S.start || S.result || S.imported
      || S.draw.nodes.length || S.corr.pts.length;
    if (hay && !confirm(T('clear_confirm'))) return;
  }
  S.zones = [];
  S.start = null; S.finish = null;
  S.fromName = ''; S.toName = '';
  if ($('fromQ')) { $('fromQ').value = ''; $('toQ').value = ''; }
  if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
  if (finishMarker) { map.removeLayer(finishMarker); finishMarker = null; }
  corrClear();
  drawZones(); renderZones();
  resetAll(false);
  $('messages').innerHTML = '';
  setMode('start');
  markDirty();
}

async function deleteProject() {
  // Sin carrera guardada activa, «Eliminar» no tenía nada que borrar y no hacía
  // NADA: ni acción ni aviso. Un botón que a veces no hace nada y no dice por qué
  // enseña a desconfiar de todos los demás. Aquí ofrece lo que el usuario quería:
  // vaciar lo que hay en pantalla.
  if (!S.activeId) {
    if (confirm(T('del_scratch'))) clearAll(true);
    return;
  }
  const cur = S.open.find(p => p.id === S.activeId);
  if (!confirm(T('p_confirm_del').replace('{n}', cur ? cur.name : ''))) return;
  await fetch(`/api/projects/${S.activeId}`, { method: 'DELETE' });
  S.open = S.open.filter(p => p.id !== S.activeId);
  if (!S.open.length) S.open = [{ id: null, name: T('scratch') }];
  S.activeId = S.open[0].id; S.dirty = false;
  await openActive();
  await loadProjects();
}

async function closeTab(id) {
  const target = id || null;
  await flushSave();
  S.open = S.open.filter(p => (p.id || null) !== target);
  if (!S.open.length) S.open = [{ id: null, name: T('scratch') }];
  if (target === S.activeId) { S.activeId = S.open[0].id || null; openActive(); }
  renderTabs();
}

async function switchTo(id) {
  const target = id || null;
  if (target === S.activeId) return;
  await flushSave();
  S.activeId = target; S.dirty = false;
  await openActive();
  renderTabs();
}

async function openActive() {
  clearResult();
  if (!S.activeId) { resetAll(true); renderTabs(); return; }
  const r = await fetch(`/api/projects/${S.activeId}`);
  if (!r.ok) return;
  const p = await r.json();
  applyState(p.state);
  const tab = S.open.find(x => x.id === p.id);
  if (tab) tab.name = p.name;
  S.dirty = false; renderTabs();
}

function openSaved(id) {
  if (!S.open.some(p => p.id === id)) {
    const meta = S.projects.find(p => p.id === id);
    S.open.push({ id, name: meta ? meta.name : id });
  }
  switchTo(id);
}

function routeThumb(state, w = 220, h = 130) {
  const rt = state && state.result && state.result.recommended;
  if (!rt || !rt.coordinates || rt.coordinates.length < 3)
    return `<div class="hint" style="font-size:10.5px">${T('no_route_yet')}</div>`;
  const c = rt.coordinates;
  const lons = c.map(p => p[0]), lats = c.map(p => p[1]);
  const x0 = Math.min(...lons), x1 = Math.max(...lons);
  const y0 = Math.min(...lats), y1 = Math.max(...lats);
  const pad = 10;
  // La escala se iguala en ambos ejes para no deformar la silueta del circuito.
  const sx = (w - 2 * pad) / ((x1 - x0) || 1e-9);
  const sy = (h - 2 * pad) / ((y1 - y0) || 1e-9);
  const s = Math.min(sx, sy);
  const ox = (w - (x1 - x0) * s) / 2, oy = (h - (y1 - y0) * s) / 2;
  const step = Math.max(1, Math.floor(c.length / 400));
  let d = '';
  for (let i = 0; i < c.length; i += step) {
    const X = ox + (c[i][0] - x0) * s;
    const Y = h - (oy + (c[i][1] - y0) * s);
    d += `${i ? 'L' : 'M'}${X.toFixed(1)},${Y.toFixed(1)} `;
  }
  return `<svg width="${w}" height="${h}"><path d="${d}" fill="none"
    stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

async function openGallery() {
  const metas = await (await fetch('/api/projects')).json();
  const full = await Promise.all(metas.map(m =>
    fetch(`/api/projects/${m.id}`).then(r => r.json())));

  const wrap = document.createElement('div');
  wrap.className = 'gal';
  const cards = full.map(p => {
    const st = p.state || {};
    const rt = st.result && st.result.recommended;
    const km = rt ? `${fmt(toU(rt.metrics.distance_m), 2)} ${uLabel()}` : '—';
    const score = rt ? rt.global_score.toFixed(1) : '—';
    const when = new Date(p.updated_at * 1000).toLocaleDateString(
      S.lang === 'es' ? 'es-CL' : 'en-US');
    return `<div class="card">
      <div class="thumb" data-open="${p.id}">${routeThumb(st)}</div>
      <div class="body" data-open="${p.id}">
        <div class="nm">${p.name}</div>
        <div class="meta">${p.description || ''}</div>
        <div class="meta">${km} · ${score}/100 · ${when}</div>
      </div>
      <div class="acts">
        <button data-open="${p.id}">${T('gal_open')}</button>
        <button data-dup="${p.id}">${T('gal_dup')}</button>
        <button data-del="${p.id}" class="danger">${T('gal_del')}</button>
      </div></div>`;
  }).join('');

  wrap.innerHTML = `<div class="inner">
    <header><h3 style="margin:0;flex:1">${T('gal_title')}</h3>
      <button id="galClose">${T('p_cancel')}</button></header>
    <div class="grid">${cards || `<div class="hint">${T('gal_empty')}</div>`}</div>
  </div>`;
  document.body.appendChild(wrap);

  const close = () => wrap.remove();
  wrap.querySelector('#galClose').onclick = close;
  wrap.onclick = e => { if (e.target === wrap) close(); };
  wrap.querySelectorAll('[data-open]').forEach(el => el.onclick = async e => {
    e.stopPropagation(); await flushSave(); close(); openSaved(el.dataset.open);
  });
  wrap.querySelectorAll('[data-dup]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    await fetch(`/api/projects/${el.dataset.dup}/duplicate`, { method: 'POST' });
    close(); await loadProjects(); openGallery();
  });
  wrap.querySelectorAll('[data-del]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    const p = full.find(x => x.id === el.dataset.del);
    if (!confirm(T('p_confirm_del').replace('{n}', p ? p.name : ''))) return;
    await fetch(`/api/projects/${el.dataset.del}`, { method: 'DELETE' });
    S.open = S.open.filter(x => x.id !== el.dataset.del);
    if (!S.open.length) S.open = [{ id: null, name: T('scratch') }];
    if (S.activeId === el.dataset.del) { S.activeId = S.open[0].id || null; openActive(); }
    close(); await loadProjects(); openGallery();
  });
}

async function loadPresets() {
  S.presets = await (await fetch(
    '/api/presets?discipline=' + encodeURIComponent(S.discipline))).json();
  $('presets').innerHTML = Object.keys(S.presets).map(k =>
    `<div class="chip" data-p="${k}">${PRESET_NAMES[k] || k}</div>`).join('');
  document.querySelectorAll('#presets .chip').forEach(c => c.onclick = () => {
    const p = S.presets[c.dataset.p]; if (!p) return;
    // Un preset puede traer la distancia como horquilla y un desnivel buscado:
    // así es como se plantea una marcha, y el preset tiene que poder decirlo.
    if (p.discipline && p.discipline !== S.discipline) setDiscipline(p.discipline);
    S.distMode = p.mode === 'range' ? 'range' : 'target';
    if (p.mode === 'range') {
      $('rmin').value = p.range_min_m;
      $('rmax').value = p.range_max_m;

    $('gainTarget').value = p.target_gain_m || 0;
    $('radius').value = Math.min(150000, p.radius_m);

    document.querySelectorAll('#presets .chip').forEach(x =>
      x.classList.toggle('on', x === c));
