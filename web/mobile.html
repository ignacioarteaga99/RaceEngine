<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RaceEngine" />
<meta name="theme-color" content="#0e1116" />
<script>
/* ── API base (móvil) ────────────────────────────────────────────────────
   Por defecto, mismo origen. Con ?api=https://host:puerto se recuerda y todas
   las llamadas a /api/… van a ese servidor (el backend ya tiene CORS abierto). */
(function () {
  var q = new URLSearchParams(location.search).get('api');
  try { if (q !== null) localStorage.setItem('re_api', q); } catch (e) {}
  var base = '';
  try { base = (q !== null ? q : localStorage.getItem('re_api')) || ''; } catch (e) {}
  base = base.replace(/\/+$/, '');
  window.__apiURL = function (u) {
    return (base && typeof u === 'string' && u.charAt(0) === '/' && u.indexOf('/api/') === 0)
      ? base + u : u;
  };
  if (!base) return;
  var f = window.fetch.bind(window);
  window.fetch = function (u, o) { return f(window.__apiURL(u), o); };
  var ES = window.EventSource;
  window.EventSource = function (u, o) { return new ES(window.__apiURL(u), o); };
  window.EventSource.prototype = ES.prototype;
  var wo = window.open.bind(window);
  window.open = function (u, t, f2) { return wo(window.__apiURL(u), t, f2); };
})();
</script>
<title>RaceEngine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234da3ff' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/leaflet.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'" />
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#252d3a;
    --tx:#e6eaf0; --tx2:#9aa6b8; --tx3:#6b7789;
    --accent:#4da3ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --mand:#3fb950; --forb:#f85149;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg);color:var(--tx);overflow:hidden;
  }
  #app{display:grid;grid-template-columns:344px 1fr 336px;height:100vh}
  .panel{background:var(--panel);overflow-y:auto;border-right:1px solid var(--line)}
  .panel.right{border-right:none;border-left:1px solid var(--line)}
  .panel::-webkit-scrollbar{width:9px}
  .panel::-webkit-scrollbar-thumb{background:#2c3542;border-radius:5px}
  header{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--panel);z-index:5}
  header h1{margin:0;font-size:15px;letter-spacing:.3px;font-weight:600}
  header .sub{font-size:11px;color:var(--tx3);margin-top:2px}
  section{padding:13px 16px;border-bottom:1px solid var(--line)}
  section h2{margin:0 0 10px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.9px;color:var(--tx3);font-weight:600}
  label{display:block;font-size:11.5px;color:var(--tx2);margin:9px 0 4px}
  input[type=number],select,input[type=text]{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent);margin:3px 0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  button{
    background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:7px;padding:8px 11px;font-size:12.5px;cursor:pointer;
    font-family:inherit;transition:.12s}
  button:hover{border-color:#3a4657;background:#222a35}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;
    font-weight:650}
  button.primary:hover{background:#69b2ff}
  button.danger{border-color:#5a2b2b;color:#ff9f99}
  button.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:650}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.wide{width:100%}
  .btns{display:flex;gap:7px;flex-wrap:wrap}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
  .chip{padding:5px 9px;border-radius:14px;font-size:11px;background:var(--panel2);
    border:1px solid var(--line);cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:650}
  #map{height:100vh;background:#0b0e13}
  .val{float:right;color:var(--tx);font-variant-numeric:tabular-nums;font-weight:600}
  .hint{font-size:10.5px;color:var(--tx3);margin-top:5px;line-height:1.45}
  .zone{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel2);
    border-radius:6px;margin-bottom:5px;font-size:12px}
  .zone .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .zone .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zone .rm{cursor:pointer;color:var(--tx3);font-size:15px;line-height:1}
  .zone .rm:hover{color:var(--bad)}
  .score{text-align:center;padding:14px 0 6px}
  .score .n{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .score .l{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.9px}
  .bar{margin:9px 0}
  .bar .t{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px}
  .bar .t span:last-child{font-variant-numeric:tabular-nums;color:var(--tx2)}
  .bar .track{height:5px;background:#232b36;border-radius:3px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .35s}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;
    border-bottom:1px solid #1c232e}
  .kv:last-child{border-bottom:none}
  .kv span:first-child{color:var(--tx2)}
  .kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
  .badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:9.5px;
    font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-left:5px}
  .b-ok{background:rgba(63,185,80,.16);color:var(--ok)}
  .b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
  .b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
  .msg{padding:9px 11px;border-radius:7px;font-size:11.5px;margin-bottom:7px;line-height:1.5}
  .msg.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3)}
  .msg.warn{background:rgba(210,153,34,.09);border:1px solid rgba(210,153,34,.26)}
  .msg.ok{background:rgba(63,185,80,.09);border:1px solid rgba(63,185,80,.26)}
  .msg b{display:block;margin-bottom:2px}
  .msg .fix{margin-top:6px;font-size:11px;padding:4px 8px}
  #status{padding:9px 16px;font-size:11.5px;color:var(--tx2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:9px;background:var(--panel)}
  .spin{width:11px;height:11px;border:2px solid #2f3947;border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  #prog{height:2px;background:#222a35;overflow:hidden}
  #prog div{height:100%;width:0;background:var(--accent);transition:width .3s}
  .log{font:10.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx3);
    background:#0d1117;border-radius:6px;padding:8px;max-height:150px;overflow:auto;
    white-space:pre-wrap}
  .expl{font-size:11.5px;color:var(--tx2);line-height:1.6}
  .expl li{margin-bottom:5px}
  .expl ul{margin:0;padding-left:15px}
  .alts{display:flex;flex-direction:column;gap:5px}
  .alt{padding:7px 9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;cursor:pointer;font-size:11.5px;display:flex;justify-content:space-between}
  .alt:hover{border-color:var(--accent)}
  .alt.on{background:rgba(77,163,255,.07)}
  .alt{align-items:center;gap:8px}
  .alt .sw{width:14px;height:4px;border-radius:2px;flex:0 0 auto}
  .alt .meta{flex:1;display:flex;justify-content:space-between;gap:8px}
  .alt .off{opacity:.42}
  .buildlog{font:10px/1.5 ui-monospace,Menlo,monospace;color:var(--tx3);
    background:#0d1117;border-radius:6px;padding:7px;margin-top:7px;
    max-height:110px;overflow:auto;white-space:pre-wrap}
  .cursor-cross{cursor:crosshair!important}
  .cursor-pan .leaflet-container,.cursor-pan{cursor:grab!important}
  .cursor-pan .leaflet-container:active,.cursor-pan:active{cursor:grabbing!important}
  .leaflet-container{background:#0b0e13}
  .attrib{font-size:9.5px;color:var(--tx3);padding:9px 16px;line-height:1.5}
  details summary{cursor:pointer;font-size:11px;color:var(--tx3);
    text-transform:uppercase;letter-spacing:.8px;font-weight:600}
  details[open] summary{margin-bottom:9px}
  .empty{text-align:center;color:var(--tx3);font-size:12px;padding:26px 12px;line-height:1.6}
  .langbar{display:flex;gap:4px;align-items:center}
  .lang{padding:3px 8px;border-radius:5px;font-size:10.5px;background:var(--panel2);
    border:1px solid var(--line);cursor:pointer;color:var(--tx2)}
  .lang.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
  .pbar{height:6px;background:#232b36;border-radius:3px;overflow:hidden;margin:7px 0 4px}
  .pbar div{height:100%;background:var(--accent);width:0;transition:width .5s}
  .pmeta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx3)}
  .zhandle{background:#fff;border:2px solid #0b1220;border-radius:50%;
    width:10px;height:10px;cursor:ew-resize;box-sizing:border-box}
  .zcenter{background:#fff;border:2px solid #0b1220;border-radius:50%;
    width:9px;height:9px;cursor:move;box-sizing:border-box}
  .chart text{font:9px -apple-system,sans-serif;fill:#6b7789}
  .chart .axlbl{font-size:9px;fill:#556}
  .profread{font:10.5px ui-monospace,Menlo,monospace;color:var(--accent);
    text-align:center;margin-top:3px;height:14px}
  #maphud{position:absolute;bottom:10px;left:10px;z-index:600;pointer-events:none;
    background:rgba(14,17,22,.86);border:1px solid var(--line);border-radius:7px;
    padding:5px 9px;font:10.5px ui-monospace,Menlo,monospace;color:var(--tx2);
    line-height:1.5;backdrop-filter:blur(3px);opacity:0;transition:opacity .15s}
  #maphud.on{opacity:1}
  #maphud b{color:var(--tx);font-weight:600}
  .gal{position:fixed;inset:0;background:rgba(4,10,18,.8);z-index:2000;
    display:flex;align-items:center;justify-content:center;padding:40px}
  .gal .inner{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column}
  .gal header{display:flex;align-items:center;gap:10px;padding:16px 20px}
  .gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;padding:0 20px 20px;overflow:auto}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    overflow:hidden;cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .thumb{height:130px;background:#0b0e13;display:flex;align-items:center;
    justify-content:center}
  .card .body{padding:9px 11px}
  .card .nm{font-size:12.5px;font-weight:600;margin-bottom:2px}
  .card .meta{font-size:10.5px;color:var(--tx3);line-height:1.5}
  .card .acts{display:flex;gap:5px;padding:0 11px 10px}
  .card .acts button{padding:4px 8px;font-size:10.5px;flex:1}
  .chart .grid{stroke:#232b36;stroke-width:1}
  .chart .axis{stroke:#3a4657;stroke-width:1}
  #tabs{display:flex;align-items:center;gap:4px;padding:6px 10px;background:#11151c;
    border-bottom:1px solid var(--line);overflow-x:auto;min-height:40px}
  #tabs::-webkit-scrollbar{height:0}
  .tab{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px 6px 0 0;
    background:var(--panel2);border:1px solid var(--line);border-bottom:none;
    font-size:12px;cursor:pointer;white-space:nowrap;color:var(--tx2)}
  .tab.on{background:var(--panel);color:var(--tx);border-color:var(--accent)}
  .tab .dirty{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:0 0 auto}
  .tab .x{color:var(--tx3);font-size:14px;line-height:1}
  .tab .x:hover{color:var(--bad)}
  .tabtools{display:flex;gap:5px;margin-left:auto;flex:0 0 auto}
  .tabtools button{padding:5px 9px;font-size:11.5px}
  .modal{position:fixed;inset:0;background:rgba(4,10,18,.72);display:flex;
    align-items:center;justify-content:center;z-index:2000}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:20px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h3{margin:0 0 14px;font-size:14px}
  .zone input.rn{background:#0d1117;border:1px solid var(--accent);color:var(--tx);
    border-radius:4px;padding:2px 5px;font-size:12px;width:100%;font-family:inherit}
  /* Controles flotantes sobre el mapa: no roban altura al mapa. Van APILADOS
     arriba, no repartidos: abajo a la izquierda vive la lectura del cursor y
     los dos textos se pisaban. */
  .mapstack{position:absolute;top:10px;left:54px;right:12px;z-index:640;
    display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .mapstack>*{pointer-events:auto}
  .mapbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
    padding:7px 10px;border-radius:9px;border:1px solid var(--line);
    background:rgba(13,20,30,.93);backdrop-filter:blur(3px);
    box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .mapbar #drawRead{font-size:11.5px;font-variant-numeric:tabular-nums;
    color:var(--tx2);min-width:200px}
  .maptoast{box-shadow:0 6px 24px rgba(0,0,0,.5);border-radius:9px}
  /* Fondo OPACO y oscuro pase lo que pase debajo. Los `.msg` del panel usan
     fondos con un 9% de alfa, que se leen perfectamente sobre el panel oscuro y
     desaparecen sobre un mapa base claro como Voyager o el satélite. Aquí manda
     el contraste, no la coherencia con el panel: el color sólo se conserva en el
     borde, que es lo que codifica la severidad. */
  .maptoast .msg{margin:0;background:rgba(13,20,30,.95);color:var(--tx);
    backdrop-filter:blur(3px)}
  .maptoast .msg.ok{border:1px solid rgba(63,185,80,.55)}
  .maptoast .msg.warn{border:1px solid rgba(210,153,34,.6)}
  .maptoast .msg.err{border:1px solid rgba(248,81,73,.6)}
  .maptoast .msg b{color:#fff}
  .found{max-height:230px;overflow:auto;margin-top:6px}
  .found .hit{padding:6px 8px;border:1px solid var(--line);border-radius:7px;
    margin-bottom:5px;cursor:pointer;font-size:11.5px;line-height:1.35}
  .found .hit:hover{border-color:var(--accent);background:#111b26}
  .found .hit.on{border-color:var(--accent);background:#12202e}
  .found .hit b{display:block;font-size:12px;color:var(--tx)}
  .found .hit span{color:var(--tx3)}
  .searchrow{display:flex;gap:6px}
  .searchrow input{flex:1}
  .picklist{max-height:210px;overflow:auto;border:1px solid var(--line);
    border-radius:7px;padding:4px}
  .pickgroup{font-size:10px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--tx3);padding:6px 6px 3px;font-weight:600}
  .pickrow{display:flex;align-items:center;gap:7px;padding:3px 6px;margin:0;
    border-radius:5px;font-size:12px;cursor:pointer}
  .pickrow:hover{background:#111b26}
  .pickrow input{width:auto;margin:0;flex:0 0 auto}
  .pickrow span:nth-of-type(1){flex:1}
  .pickrow .tag{color:var(--tx3);font-size:10.5px}
  .pickrow.done{opacity:.55}

  /* Control de estilo de mapa, flotando sobre el propio mapa. Va abajo a la
     derecha para no competir con el zoom (arriba izquierda) ni con la barra de
     trazado (arriba). */
  .mapctl{position:absolute;right:12px;bottom:12px;z-index:640}
  /* Salida y meta, apiladas como en un navegador. Ancho acotado: ocupar toda
     la anchura del mapa para dos casillas es tapar el mapa por gusto. */
  .routebar{position:relative;align-items:stretch;gap:8px;max-width:430px;
    padding:8px 10px}
  .routebar .ends{flex:1;display:flex;flex-direction:column;gap:6px}
  .routebar .endrow{display:flex;align-items:center;gap:7px;position:relative}
  .routebar .endrow .pin{font-size:13px;width:16px;text-align:center;flex:0 0 auto}
  .routebar .endrow input{flex:1;padding:6px 22px 6px 8px;font-size:12px;
    background:#0d141e;border:1px solid var(--line);border-radius:6px;color:var(--tx)}
  .routebar .endrow .clr{position:absolute;right:6px;color:var(--tx3);cursor:pointer;
    font-size:14px;line-height:1;padding:2px 3px}
  .routebar .endrow .clr:hover{color:var(--bad)}
  .routebar .swap{flex:0 0 auto;align-self:center;padding:6px 9px;font-size:14px;
    line-height:1}
  .routebar .found{position:absolute;left:10px;right:10px;top:100%;margin-top:5px;
    max-height:220px;overflow:auto;background:rgba(13,20,30,.97);
    border:1px solid var(--line);border-radius:8px;z-index:660;
    box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .routebar .found:empty{display:none}
  .mapfind{position:absolute;right:12px;bottom:56px;z-index:640;width:270px}
  .mapfind input{width:100%;padding:7px 9px;font-size:12px;
    background:rgba(13,20,30,.95);backdrop-filter:blur(3px);
    border:1px solid var(--line);border-radius:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .mapfind .found{max-height:210px;background:rgba(13,20,30,.97);
    border-radius:8px;margin-top:5px;padding:0 5px}
  .mapfind .found:empty{display:none}
  .mapfind button{position:absolute;right:5px;top:4px;padding:3px 8px;font-size:11px}
  .mapctl select{width:auto;min-width:132px;padding:6px 8px;font-size:11.5px;
    background:rgba(13,20,30,.93);backdrop-filter:blur(3px);
    border:1px solid var(--line);border-radius:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.45)}

  /* Modo básico: lo avanzado sigue en el DOM (y por tanto sigue aplicándose),
     simplemente no se enseña. Ocultarlo NO lo desactiva, y por eso el aviso de
     `#advNote` dice cuántos ajustes ocultos están fuera de su valor por defecto:
     un panel que esconde una restricción activa es un panel que miente. */
  body.basic .adv{display:none !important}
  /* Sin distancia objetivo no hay vueltas que dar ni distancia que homologar. */
  body.freeroute .needs-distance{display:none !important}

  /* Barra indeterminada: el enganche pasa en el servidor y no se puede seguir
     paso a paso, pero una espera con movimiento no es una pantalla colgada. */
  .pbar.indet{overflow:hidden;position:relative}
  .pbar.indet>div{width:38%;position:absolute;left:0;
    animation:corre 1.15s ease-in-out infinite}
  @keyframes corre{0%{left:-38%}100%{left:100%}}
  .verdict{border-radius:8px;padding:8px 10px;margin-top:8px;font-size:11.5px;
    line-height:1.45;border:1px solid var(--line);background:var(--panel2)}
  .verdict b{display:block;font-size:12px;margin-bottom:3px}
  .verdict.ok{border-color:rgba(63,185,80,.5)}
  .verdict.warn{border-color:rgba(210,153,34,.55)}
  .verdict.bad{border-color:rgba(248,81,73,.55)}

  .cmp{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
  .cmp th,.cmp td{padding:4px 6px;border-bottom:1px solid var(--line);
    text-align:right;font-variant-numeric:tabular-nums}
  .cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--tx2)}
  .cmp thead th{color:var(--tx3);font-weight:600;text-transform:uppercase;
    font-size:10px;letter-spacing:.6px}
  .cmp td.win{color:var(--ok);font-weight:650}

  /* ═══ CAPA MÓVIL (generada por build_mobile.py) ═══════════════════════ */
  :root{--navh:58px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
  html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body{-webkit-text-size-adjust:100%}
  #app{display:block;height:100dvh;position:relative}
  /* !important: el panel central trae display/position en línea. */
  #app>div{position:absolute!important;left:0;right:0;top:0;
    bottom:calc(var(--navh) + var(--sb));display:none!important;padding-top:var(--st)}
  body.m-cfg #app>div:nth-child(1){display:block!important}
  body.m-map #app>div:nth-child(2){display:flex!important}
  body.m-res #app>div:nth-child(3){display:block!important}
  .panel,.panel.right{border:none;-webkit-overflow-scrolling:touch}
  #map{height:auto;min-height:0}

  /* Táctil: objetivos de 40 px e inputs a 16 px (evita el zoom de Safari). */
  button{min-height:40px;padding:9px 13px;font-size:14px}
  .chip{padding:8px 12px;font-size:13px}
  input[type=number],select,input[type=text],textarea,
  .routebar .endrow input,.mapfind input{font-size:16px;padding:9px 10px}
  input[type=range]{height:30px}
  label{font-size:13px}
  .hint{font-size:12px}
  section{padding:14px 16px}
  .zone{padding:10px;font-size:14px}
  .zone .rm{font-size:22px;padding:0 4px}
  .alt{padding:11px;font-size:13px}
  .kv{font-size:13.5px;padding:6px 0}

  /* Barra de modos del mapa: una sola fila con scroll horizontal. */
  #app>div:nth-child(2)>div:nth-child(4){flex-wrap:nowrap!important;overflow-x:auto;
    padding:8px 10px!important;scrollbar-width:none}
  #app>div:nth-child(2)>div:nth-child(4)::-webkit-scrollbar{display:none}
  #app>div:nth-child(2)>div:nth-child(4)>*{flex:0 0 auto}
  #app>div:nth-child(2)>div:nth-child(4)>span:first-child{display:none}
  #tabs{min-height:44px}
  .tab{padding:8px 11px;font-size:13px}

  /* Controles flotantes sobre el mapa. */
  .mapstack{left:56px;right:8px;top:8px}
  .routebar{max-width:none}
  .mapbar #drawRead{min-width:0}
  .mapfind{left:8px;right:8px;width:auto;bottom:66px}
  .mapctl{right:8px;bottom:8px}
  .leaflet-touch .leaflet-bar a{width:38px;height:38px;line-height:38px}
  #maphud{display:none}

  /* Modales y galería a pantalla casi completa. */
  .modal .box{width:calc(100vw - 24px);max-height:85dvh;overflow:auto}
  .gal{padding:calc(var(--st) + 10px) 10px calc(var(--sb) + 10px)}
  .gal .inner{max-height:100%}
  .gal .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 12px 12px}
  .card:hover{transform:none}
  .cmp{font-size:12px;display:block;overflow-x:auto}

  /* Barra de pestañas inferior. */
  #mnav{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:flex;
    height:calc(var(--navh) + var(--sb));padding-bottom:var(--sb);
    background:rgba(17,21,28,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-top:1px solid var(--line)}
  #mnav button{flex:1;min-height:0;border:none;background:none;border-radius:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--tx3);font-size:10.5px;font-weight:600;letter-spacing:.2px;padding:6px 0;
    position:relative}
  #mnav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  #mnav button.on{color:var(--accent)}
  #mnav button .dot{position:absolute;top:7px;left:calc(50% + 9px);width:8px;height:8px;
    border-radius:50%;background:var(--ok);display:none}
  #mnav button.new .dot{display:block}
  #mGen{position:fixed;right:14px;bottom:calc(var(--navh) + var(--sb) + 14px);z-index:1400;
    border-radius:26px;padding:12px 20px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.5);
    display:none}
  body.m-cfg #mGen{display:block}
</style>
</head>
<body>
<div id="app">

  <!-- ══ IZQUIERDA · CONFIGURACIÓN ══════════════════════════════════════ -->
  <div class="panel">
    <header style="display:flex;align-items:flex-start;gap:8px">
      <div style="flex:1">
        <h1>RaceEngine <span style="color:var(--tx3);font-weight:400">V2</span></h1>
        <div class="sub" data-t="tagline"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
        <div class="langbar">
          <div class="lang on" data-lang="es">ES</div>
          <div class="lang" data-lang="en">EN</div>
        </div>
        <div class="langbar" title="km / mi">
          <div class="lang on" data-unit="km" data-t="unit_km"></div>
          <div class="lang" data-unit="mi" data-t="unit_mi"></div>
        </div>
        <!-- Modo básico / avanzado. Tener las once capas desplegadas a la vez
             abrumaba: el 90 % de las carreras se define con distancia, forma,
             desnivel y objetivo. El resto sigue ahí, pero hay que pedirlo. -->
        <div class="langbar" id="modeBar" style="margin-top:2px">
          <div class="lang on" data-adv="0" data-t="mode_basic"></div>
          <div class="lang" data-adv="1" data-t="mode_adv"></div>
        </div>
      </div>
    </header>
    <div id="advNote" class="hint" style="padding:0 16px 10px;margin:0"></div>

    <section>
      <h2 data-t="discipline"></h2>
      <!-- Va antes que todo lo demás porque es anterior a todo lo demás: decide
           sobre qué vías se busca. Una nacional es la columna de una marcha
           cicloturista y un sitio al que no se manda a un corredor. -->
      <div class="chips" id="disciplines"></div>
      <div class="hint" id="disciplineHint"></div>
    </section>

    <section>
      <h2 data-t="projects"></h2>
      <div id="savedList"></div>
    </section>

    <section>
      <h2 data-t="region"></h2>
      <!-- El valor real que viaja al motor es la lista de comunas unida por «+».
           Se guarda en un campo oculto para que el guardado de carreras, el
           modelo y el historial sigan tratándolo como un único identificador. -->
      <input type="hidden" id="region">
      <div class="hint" data-t="region_multi_hint" style="margin-bottom:6px"></div>
      <div class="picklist" id="regionPick"></div>
      <label style="margin-top:6px">
        <input type="checkbox" id="showArea" style="width:auto;vertical-align:-1px">
        <span data-t="show_area"></span></label>
      <div id="regionWarn"></div>
      <div class="hint" id="regionInfo"></div>
      <div id="regionBuild"></div>

      <details id="corridorFinder" style="margin-top:11px">
        <summary data-t="corr_title"></summary>
        <div class="hint" data-t="corr_hint" style="margin:6px 0 7px"></div>
        <div class="btns">
          <button id="btnCorrDraw" style="flex:1" data-t="corr_draw"></button>
          <button id="btnCorrUndo" data-t="corr_undo"></button>
          <button id="btnCorrClear" class="danger" data-t="corr_clear"></button>
        </div>
        <label style="margin-top:8px"><span data-t="corr_buffer"></span>
          <span class="val" id="vCorrBuf"></span></label>
        <input type="range" id="corrBuf" min="1000" max="25000" step="500" value="6000">
        <div id="corrInfo"></div>
        <input type="text" id="corrName" placeholder="Santiago → Farellones"
               style="margin-top:7px">
        <button id="btnCorrBuild" class="wide" style="margin-top:7px"
                data-t="corr_build"></button>
        <div id="corrState"></div>
      </details>

      <details id="cityFinder" style="margin-top:11px">
        <summary data-t="find_city"></summary>
        <div class="hint" data-t="find_hint" style="margin:6px 0 7px"></div>
        <div class="searchrow">
          <input type="text" id="cityQ" placeholder="Viña del Mar, Kyoto, Bogotá…">
          <button id="btnCityGo" data-t="find_go"></button>
        </div>
        <div id="cityResults" class="found"></div>
        <div id="cityPick" style="display:none">
          <label style="margin-top:8px"><span data-t="find_radius"></span>
            <span class="val" id="vCityR"></span></label>
          <input type="range" id="cityR" min="2000" max="25000" step="500" value="8000">
          <div class="hint" data-t="find_radius_hint"></div>
          <button id="btnCityBuild" class="wide" style="margin-top:7px" data-t="find_build"></button>
        </div>
        <div id="cityState"></div>
      </details>
    </section>

    <section>
      <h2 data-t="preset"></h2>
      <div class="chips" id="presets"></div>
      <button id="btnReset" class="wide" style="margin-top:8px" data-t="reset"></button>
    </section>

    <section>
      <h2 data-t="l1"></h2>
      <!-- Dos formas de plantear un recorrido, y no es un matiz de interfaz:
           en competición la distancia se anuncia y manda; en cicloturismo lo
           que se promete es el desnivel y los kilómetros son consecuencia. -->
      <div class="langbar" id="distMode" style="margin-bottom:8px;flex-wrap:wrap">
        <div class="lang on" data-dmode="target" data-t="dm_target"></div>
        <div class="lang" data-dmode="range" data-t="dm_range"></div>
        <div class="lang" data-dmode="free" data-t="dm_free"></div>
      </div>
      <div id="distFree" style="display:none">
        <div class="verdict"><b data-t="dm_free_t"></b><span data-t="dm_free_b"></span></div>
      </div>
      <div id="distTarget">
        <label><span data-t="target"></span> <span class="val" id="vDist"></span></label>
        <input type="range" id="dist" min="1000" max="300000" step="500" value="10000">
        <label><span data-t="tolerance"></span> <span class="val" id="vTol"></span></label>
        <input type="range" id="tol" min="0.5" max="15" step="0.5" value="2">
        <div class="hint" id="tolHint"></div>
      </div>
      <div id="distRange" style="display:none">
        <label><span data-t="range_min"></span> <span class="val" id="vRmin"></span></label>
        <input type="range" id="rmin" min="1000" max="300000" step="1000" value="110000">
        <label><span data-t="range_max"></span> <span class="val" id="vRmax"></span></label>
        <input type="range" id="rmax" min="1000" max="300000" step="1000" value="135000">
        <div class="hint" data-t="range_hint"></div>
      </div>
      <div class="adv needs-distance">
        <label style="margin-top:9px"><span data-t="measurement"></span></label>
        <select id="measurement">
          <option value="centerline" data-t="meas_center"></option>
          <option value="certified" data-t="meas_cert"></option>
        </select>
        <!-- El selector a secas no decía nada: «eje» y «certificable» no son
             palabras que expliquen por qué el mismo recorrido cambia de número.
             Aquí se explica con los metros concretos de esta configuración. -->
        <div id="measBox"></div>
      </div>
    </section>

    <section>
      <h2 data-t="l2"></h2>
      <select id="shape">
        <option value="circuit" data-t="shape_circuit"></option>
        <option value="open" data-t="shape_open"></option>
      </select>
      <div class="hint" id="shapeHint"></div>
      <div class="needs-distance">
        <label style="margin-top:9px"><span data-t="laps"></span>
          <span class="val" id="vLaps"></span></label>
        <input type="range" id="laps" min="1" max="40" step="1" value="1">
        <div class="hint" id="lapsHint"></div>
      </div>
      <label style="margin-top:9px" class="adv">
        <input type="checkbox" id="reuse" style="width:auto;vertical-align:-1px">
        <span data-t="reuse"></span></label>
    </section>

    <section>
      <h2 data-t="l3"></h2>
      <label><input type="checkbox" id="elevOn" checked style="width:auto;vertical-align:-1px">
        <span data-t="elev_on"></span></label>
      <label><span data-t="max_gain"></span> <span class="val" id="vGain"></span></label>
      <input type="range" id="gain" min="0" max="8000" step="10" value="0">
      <!-- Desnivel BUSCADO, no máximo tolerado. Es la vuelta del calcetín que
           distingue una carrera a pie de una marcha de montaña. -->
      <div id="gainTargetBox">
        <label style="margin-top:9px"><span data-t="gain_target"></span>
          <span class="val" id="vGainT"></span></label>
        <input type="range" id="gainTarget" min="0" max="8000" step="50" value="0">
        <div class="hint" id="gainTargetHint"></div>
      </div>
      <div class="adv">
        <label><span data-t="max_grade"></span> <span class="val" id="vGrade"></span></label>
        <input type="range" id="grade" min="0" max="20" step="0.5" value="0">
        <label style="margin-top:7px">
          <input type="checkbox" id="flatter" checked style="width:auto;vertical-align:-1px">
          <span data-t="flatter"></span></label>
        <div class="hint" data-t="elev_hint"></div>
      </div>
    </section>

    <section class="adv">
      <h2 data-t="l4"></h2>
      <label><span data-t="radius"></span> <span class="val" id="vRad"></span></label>
      <input type="range" id="radius" min="500" max="150000" step="500" value="4000">
      <label><span data-t="smooth"></span> <span class="val" id="vSmooth"></span></label>
      <input type="range" id="smooth" min="0" max="1" step="0.05" value="0.5">
      <label><span data-t="uturn"></span> <span class="val" id="vUturn"></span></label>
      <input type="range" id="uturn" min="0" max="20" step="1" value="4">
    </section>

    <section class="adv">
      <h2 data-t="l5"></h2>
      <div class="row">
        <div><label data-t="max_cross"></label><input type="number" id="maxCross"></div>
        <div><label data-t="max_lights"></label><input type="number" id="maxLights"></div>
      </div>
    </section>

    <section class="adv">
      <h2 data-t="l68"></h2>
      <label><input type="checkbox" id="private" checked style="width:auto;vertical-align:-1px">
        <span data-t="avoid_private"></span></label>
      <label><input type="checkbox" id="tunnels" checked style="width:auto;vertical-align:-1px">
        <span data-t="avoid_tunnels"></span></label>
      <label><input type="checkbox" id="wide" checked style="width:auto;vertical-align:-1px">
        <span data-t="wide"></span></label>
      <label><input type="checkbox" id="closures" checked style="width:auto;vertical-align:-1px">
        <span data-t="closures"></span></label>
      <label><input type="checkbox" id="parks" style="width:auto;vertical-align:-1px">
        <span data-t="parks"></span></label>
    </section>

    <!-- La capacidad estaba escondida entre cinco casillas de logística y sin
         decir para qué servía el número. Es su propio bloque, con ejemplos de un
         clic y el veredicto en palabras, no cuatro cifras sueltas. -->
    <section>
      <h2 data-t="cap_h"></h2>
      <div class="hint" data-t="field_hint" style="margin-bottom:7px"></div>
      <label><span data-t="field_size"></span></label>
      <input type="number" id="fieldSize" min="1" max="200000" placeholder="—">
      <div class="chips" id="fieldChips" style="margin-top:6px">
        <div class="chip" data-f="500">500</div>
        <div class="chip" data-f="2000">2.000</div>
        <div class="chip" data-f="5000">5.000</div>
        <div class="chip" data-f="15000">15.000</div>
        <div class="chip" data-f="">—</div>
      </div>
      <div id="capBox"></div>
    </section>

    <section>
      <h2 data-t="objective"></h2>
      <select id="objective">
        <option value="balanced" data-t="obj_balanced"></option>
        <option value="flattest" data-t="obj_flattest"></option>
        <option value="fewest_closures" data-t="obj_closures"></option>
        <option value="most_scenic" data-t="obj_scenic"></option>
        <option value="fastest" data-t="obj_fastest"></option>
        <option value="climbing" data-t="obj_climbing"></option>
      </select>
      <div class="hint" data-t="obj_hint"></div>
    </section>

    <section>
      <h2 data-t="budget"></h2>
      <label><span data-t="total_time"></span> <span class="val" id="vBudget"></span></label>
      <input type="range" id="budget" min="3" max="90" step="1" value="20">
      <div class="adv">
        <label style="margin-top:7px">
          <input type="checkbox" id="repro" checked style="width:auto;vertical-align:-1px">
          <span data-t="repro"></span></label>
        <div class="hint" data-t="repro_hint"></div>
      </div>
      <div class="hint" data-t="budget_hint"></div>
    </section>

    <div class="attrib">
      Datos © OpenStreetMap contributors (ODbL).<br>
      Los teselados son de openstreetmap.org y sirven solo para desarrollo —
      en producción hay que auto-hospedarlos (doc 07 §2.4).
    </div>
  </div>

  <!-- ══ CENTRO · MAPA ══════════════════════════════════════════════════ -->
  <div style="position:relative;display:flex;flex-direction:column">
    <div id="tabs"></div>
    <div id="status">
      <span id="statusIcon"></span>
      <span id="statusText"></span>
      <span style="flex:1"></span>
      <span id="timing" style="font-variant-numeric:tabular-nums;color:var(--tx3)"></span>
    </div>
    <div id="prog"><div></div></div>
    <div style="padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);
                display:flex;gap:7px;align-items:center;flex-wrap:wrap">
      <span style="font-size:10.5px;color:var(--tx3);text-transform:uppercase;
                   letter-spacing:.8px;font-weight:600" data-t="click_map"></span>
      <button data-mode="pan" data-t="m_pan"></button>
      <button class="active" data-mode="start" data-t="m_start"></button>
      <button id="btnModeFinish" data-mode="finish" data-t="m_finish" style="display:none"></button>
      <button data-mode="mandatory" data-t="m_mand"></button>
      <button data-mode="forbidden" data-t="m_forb"></button>
      <button id="btnModeDraw" data-mode="draw" data-t="m_draw"></button>
      <button id="btnModeCorr" data-mode="corridor" data-t="m_corr"
              style="display:none"></button>
      <span style="flex:1"></span>
      <!-- Evaluar un recorrido existente es una alternativa a generar uno, no un
           paso posterior. Vivía sólo en el panel derecho, bajo las zonas, y ahí
           no se encuentra: la vista va a esta barra, que es donde están las
           acciones. Mismo `input[type=file]`, un solo camino de código. -->
      <button id="btnImportTop" data-t="import_top"></button>
      <button id="btnGen" class="primary" data-t="generate"></button>
      <button id="btnCancel" class="danger" disabled data-t="stop"></button>
    </div>
    <div id="map" style="flex:1;position:relative">
      <div id="maphud"></div>
      <!-- El estilo de mapa vivía en la cabecera del panel izquierdo, a medio
           metro de lo que cambiaba. Sobre el mapa se entiende solo. -->
      <div id="mapCtl" class="mapctl">
        <select id="basemap" title="Estilo de mapa"></select>
      </div>
      <!-- Ir a un sitio. Distinto de descargarlo: para trazar un trayecto de
           San Vicente de Tagua Tagua a Rapel primero hay que poder LLEGAR ahí
           en el mapa, y arrastrando no se llega. Acepta también coordenadas
           pegadas de cualquier sitio. -->
      <div id="mapFind" class="mapfind">
        <input type="text" id="goQ" autocomplete="off">
        <button id="btnGo" data-t="go_btn"></button>
        <div id="goResults" class="found"></div>
      </div>
      <!-- Los controles del modo creativo FLOTAN sobre el mapa. Si fueran filas
           del layout, activar el modo encogería el mapa justo cuando más falta
           hace: es el momento en que el usuario está dibujando. -->
      <div id="mapStack" class="mapstack">
        <!-- Salida y meta como en un navegador: dos casillas y un intercambio.
             Antes la única forma de poner una meta era pinchar el mapa, lo que
             obliga a saber dónde cae el sitio ANTES de buscarlo — y a invertir
             un trayecto había que borrar los dos puntos y volver a ponerlos. -->
        <div id="routeBar" class="mapbar routebar">
          <div class="ends">
            <div class="endrow">
              <span class="pin">🏁</span>
              <input type="text" id="fromQ" autocomplete="off">
              <span class="clr" id="fromClear" title="×">×</span>
            </div>
            <div class="endrow">
              <span class="pin">🏆</span>
              <input type="text" id="toQ" autocomplete="off">
              <span class="clr" id="toClear" title="×">×</span>
            </div>
          </div>
          <button id="btnSwapEnds" class="swap">⇅</button>
          <div id="endsResults" class="found"></div>
        </div>
        <div id="drawBar" class="mapbar" style="display:none">
          <span id="drawRead"></span>
          <span style="flex:1"></span>
          <button id="btnDrawUndo" data-t="d_undo"></button>
          <button id="btnDrawClose" data-t="d_close"></button>
          <button id="btnDrawClear" class="danger" data-t="d_clear"></button>
        </div>
        <div id="drawMsg" class="maptoast" style="display:none"></div>
        <!-- Deshacer y borrar el trayecto vivían dentro de un desplegable del
             panel izquierdo, a un scroll de distancia de donde se estaba
             pinchando. Aquí, y con el resumen delante. -->
        <div id="corrBar" class="mapbar" style="display:none">
          <span id="corrRead"></span>
          <span style="flex:1"></span>
          <button id="btnCorrUndo2" data-t="corr_undo_full"></button>
          <button id="btnCorrClear2" class="danger" data-t="corr_clear"></button>
          <button id="btnCorrDone" class="primary" data-t="corr_done"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ DERECHA · RESULTADO ════════════════════════════════════════════ -->
  <div class="panel right">
    <header>
      <h1 data-t="result"></h1>
      <div class="sub" id="stageLabel"></div>
    </header>

    <div id="messages" style="padding:13px 16px 0"></div>

    <section id="zonesSec">
      <h2 data-t="zones"></h2>
      <div id="zoneList"></div>
      <label style="margin-top:9px"><span data-t="zone_radius"></span>
        <span class="val" id="vZr"></span></label>
      <input type="range" id="zoneRadius" min="50" max="2000" step="25" value="300">
      <div class="hint" data-t="zone_hint"></div>
    </section>

    <!-- FUERA de `#result` a propósito: comparar con el recorrido del año pasado
         es lo primero que uno quiere hacer, no lo último. Estando dentro del
         bloque de resultado, el botón no existía hasta haber generado algo. -->
    <section id="importSec">
      <h2 data-t="import_h"></h2>
      <div class="hint" data-t="import_hint" style="margin-bottom:7px"></div>
      <button id="btnImport" class="wide" data-t="import_btn"></button>

<script>
(function () {
  var SOURCES = ['/vendor/leaflet.js',
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'];
  function tryLoad(i) {
    if (i >= SOURCES.length) {
      document.getElementById('map').innerHTML =
        '<div style="padding:40px;color:#9aa6b8;font-size:13px;line-height:1.7">' +
        '<b style="color:#f85149">No se pudo cargar la librería de mapas.</b><br><br>' +
        'Conéctate a internet y recarga, o ejecuta <code>./vendor.sh</code>.</div>';
      return;
    }
    var s = document.createElement('script');
    s.src = SOURCES[i];
    s.onload = function () { window.__startApp(); };
    s.onerror = function () { tryLoad(i + 1); };
    document.head.appendChild(s);
  }
  window.__leafletLoader = function () { tryLoad(0); };
})();
</script>
<script>
// ══════════════════════════════════════════════════════════════════════════
// Estado
// ══════════════════════════════════════════════════════════════════════════
const S = {
  lang: localStorage.getItem('re_lang') || 'es',
  mode: 'start', start: null, finish: null, zones: [], regions: [], presets: {},
  gid: null, es: null, result: null, shownRoute: null,
  visible: new Set(), profileOf: null, buildPoll: null, zoneLayers: {},
  unit: localStorage.getItem('re_unit') || 'km',
  projects: [], open: [], activeId: null, dirty: false, statusKey: null,
  profilePts: null, drag: null, results: {},
  // Modo creativo: el estado del trazado vive aquí, el servidor es sin estado.
  // `legs` guarda los cortes (nodos, aristas) para poder deshacer tramo a tramo.
  draw: { on: false, nodes: [], edges: [], legs: [], closed: false, state: null },
  lastRegion: null, geomCache: {}, cityHit: null, cityHits: [],
  basemap: localStorage.getItem('re_basemap') || 'dark', build: null,
  // Modo avanzado: NO se recuerda entre sesiones. Cada apertura empieza por lo
  // imprescindible; quien necesite el resto lo pide. Recordarlo hacía que el
  // panel se abriera con once capas desplegadas por algo que se probó una vez.
  adv: false,
  // Comunas seleccionadas. El motor recibe su unión («a+b+c»).
  regionSel: [], composing: false, composed: null,
  // Recorrido importado. Vive APARTE del resultado generado: antes lo
  // reemplazaba, y comparar con el del año pasado era imposible porque al
  // importar desaparecía justo aquello con lo que se quería comparar.
  imported: null, showRaw: false,
  // Perímetro del área descargada: información, no selección.
  showArea: localStorage.getItem('re_area') === '1', areaLayer: null,
  // Nombre con el que se buscó cada punta. Se conserva para no sustituirlo por
  // unas coordenadas, que dicen mucho menos.
  fromName: '', toName: '',
  // Disciplina: decide qué vías existen. Es la primera decisión, no una más.
  discipline: localStorage.getItem('re_disc') || 'running',
  // Corredor en construcción: el trayecto que define la franja a descargar.
  corr: { pts: [], preview: null, layer: null },
  distMode: 'target', distModeTocado: false,
};
const CYCLING = ['road', 'gravel', 'mtb'];
const OFFROAD = ['trail', 'hiking'];
const isCycling = () => CYCLING.includes(S.discipline);
const isOffroad = () => OFFROAD.includes(S.discipline);
let routeCursor = null;
// Conversión SOLO de presentación: internamente todo son metros.
const MI = 1609.344;
const toU = m => S.unit === 'mi' ? m / MI : m / 1000;
const uLabel = () => S.unit === 'mi' ? 'mi' : 'km';
const dist = (m, d = 2) => `${fmt(toU(m), d)} ${uLabel()}`;
// Una marcha de 180 km son 402 minutos, y nadie lee eso. Por encima de la hora se
// escribe como se dice.
const hhmm = min => min < 90 ? `${fmt(min)} min`
  : `${Math.floor(min / 60)} h ${String(Math.round(min % 60)).padStart(2, '0')}`;
const PALETTE = ['#4da3ff', '#f0883e', '#3fb950', '#bc8cff', '#e5c07b'];
// El recorrido importado nunca comparte color con uno generado: se distingue de
// un vistazo, y además va discontinuo.
const IMPORT_COLOR = '#ff7b72';
const IMPORT_ID = 'imported';
const colorOf = (rt, i) => rt.route_id === IMPORT_ID
  ? IMPORT_COLOR : PALETTE[i % PALETTE.length];
let map, routeLayer, zoneLayer, startMarker, finishMarker;

const $ = id => document.getElementById(id);
const T = k => (I18N[S.lang] && I18N[S.lang][k]) || (I18N.es[k] || k);
// `String.replace` con una cadena sustituye SÓLO la primera aparición. Una
// plantilla que menciona el mismo dato dos veces —la explicación de la medición
// oficial nombra el objetivo al principio y al final— salía con un «{t}» crudo
// a la vista. Esto sustituye todas.
const fill = (k, vars) => Object.entries(vars || {}).reduce(
  (txt, [n, v]) => txt.split('{' + n + '}').join(v), T(k));
const fmt = (n, d = 0) => Number(n).toLocaleString(S.lang === 'es' ? 'es-CL' : 'en-US',
  { minimumFractionDigits: d, maximumFractionDigits: d });

// ══════════════════════════════════════════════════════════════════════════
// i18n
// ══════════════════════════════════════════════════════════════════════════
function applyLang() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = T(el.dataset.t);
    if (el.tagName === 'OPTION' || /<[a-z]/i.test(v)) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('.lang').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === S.lang));
  $('maxCross').placeholder = T('no_limit');
  $('goQ').placeholder = T('go_ph');
  $('maxLights').placeholder = T('no_limit');
  $('placeholder').innerHTML = T('placeholder');
  if (S.statusKey === 'ready' || !S.statusKey) $('statusText').textContent = T('ready');
  else statusK(S.statusKey);
  if (!S.result) $('stageLabel').textContent = T('not_generated');
  document.querySelectorAll('[data-unit]').forEach(c =>
    c.classList.toggle('on', c.dataset.unit === S.unit));
  renderBasemapOptions();
  renderDisciplines();
  renderTabs();
  syncLabels(); renderZones();
  renderNow();
  if (S.regionSel.length) { renderRegionPick(); onRegion(); }
  localStorage.setItem('re_lang', S.lang);
}

// ══════════════════════════════════════════════════════════════════════════
// Mapa
// ══════════════════════════════════════════════════════════════════════════
// Mapas base. El oscuro es el que va con la interfaz; los demás están porque
// según para qué —un satélite para ver el terreno real, uno claro para imprimir—
// cada uno gana. La atribución de cada proveedor es obligatoria y va incluida.
const BASEMAPS = {
  dark: { t: 'bm_dark',
    url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    attr: '© OpenStreetMap contributors © CARTO', max: 20 },
  voyager: { t: 'bm_voyager',
    url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    attr: '© OpenStreetMap contributors © CARTO', max: 20 },
  light: { t: 'bm_light',
    url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    attr: '© OpenStreetMap contributors © CARTO', max: 20 },
  osm: { t: 'bm_osm',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '© OpenStreetMap contributors', max: 19 },
  sat: { t: 'bm_sat',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    attr: 'Imágenes © Esri · datos © OpenStreetMap contributors', max: 19 },
  none: { t: 'bm_none', url: null, attr: '© OpenStreetMap contributors', max: 20 },
};
let baseLayer = null;

function setBasemap(id) {
  const b = BASEMAPS[id] || BASEMAPS.dark;
  S.basemap = BASEMAPS[id] ? id : 'dark';
  localStorage.setItem('re_basemap', S.basemap);
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
  if (b.url) {
    baseLayer = L.tileLayer(b.url, { maxZoom: b.max, attribution: b.attr,
      subdomains: 'abcd' });
    baseLayer.addTo(map);
    // El mapa base va SIEMPRE debajo de rutas y zonas.
    if (baseLayer.bringToBack) baseLayer.bringToBack();
  }
  const sel = $('basemap');
  if (sel && sel.value !== S.basemap) sel.value = S.basemap;
}

function renderBasemapOptions() {
  const sel = $('basemap');
  if (!sel) return;
  sel.innerHTML = Object.entries(BASEMAPS)
    .map(([k, b]) => `<option value="${k}">${T(b.t)}</option>`).join('');
  sel.value = S.basemap;
}

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([-33.4372, -70.6506], 13);
  setBasemap(S.basemap);
  routeLayer = L.layerGroup().addTo(map);
  zoneLayer = L.layerGroup().addTo(map);
  map.on('click', onMapClick);
  // Los controles flotan DENTRO del contenedor del mapa, así que sus eventos
  // burbujean hasta Leaflet: pulsar «Cerrar recorrido» disparaba además un clic
  // en el mapa y seguía trazando hacia el botón. Se cortan en origen.
  ['mapStack', 'mapCtl'].forEach(id => {
    const el = $(id);
    if (!el) return;
    ['click', 'dblclick', 'mousedown', 'mouseup', 'pointerdown', 'touchstart',
     'wheel', 'contextmenu'].forEach(ev =>
      el.addEventListener(ev, e => e.stopPropagation(), { capture: false }));
  });
  wireZoneDragging();
  wireMapHover();
}

const pin = (emoji, color) => L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
  html: `<div style="width:26px;height:26px;border-radius:50%;background:${color};
    border:3px solid #04121f;box-shadow:0 0 0 2px ${color};display:flex;
    align-items:center;justify-content:center;font-size:12px">${emoji}</div>` });

function setMode(mode) {
  const was = S.mode;
  S.mode = mode;
  document.querySelectorAll('[data-mode]').forEach(x =>
    x.classList.toggle('active', x.dataset.mode === mode));
  $('map').classList.toggle('cursor-cross', mode !== 'pan');
  $('map').classList.toggle('cursor-pan', mode === 'pan');
  if ((was === 'draw') !== (mode === 'draw')) setDrawMode(mode === 'draw');
  if (mode === 'corridor') { $('corridorFinder').open = true; corrRefresh(); }
  corrBarPaint();
}

function onMapClick(e) {
  if (S.suppressClick || S.drag) return;
  if (S.mode === 'pan') return;            // sólo desplazar el mapa
  if (e.originalEvent && e.originalEvent.target
      && e.originalEvent.target.closest
      && e.originalEvent.target.closest('.mapstack, .mapctl')) return;
  if (S.mode === 'draw') return drawClick(e.latlng);
  if (S.mode === 'corridor') return corrAdd(e.latlng);
  if (zoneHitTest(e.latlng, e.containerPoint)) return;   // clic dentro de una zona
  const { lat, lng } = e.latlng;
  if (S.mode === 'start') { S.fromName = ''; setStart(lat, lng); return setMode('pan'); }
  if (S.mode === 'finish') { S.toName = ''; return setFinish(lat, lng); }
  const behavior = S.mode;
  const n = S.zones.filter(z => z.behavior === behavior).length + 1;
  S.zones.push({
    id: 'z' + Date.now().toString(36), behavior, lat, lon: lng,
    buffer_m: +$('zoneRadius').value,
    name: (behavior === 'mandatory' ? (S.lang === 'es' ? 'Obligatorio ' : 'Mandatory ')
                                    : (S.lang === 'es' ? 'Prohibido ' : 'Forbidden ')) + n,
  });
  drawZones(); renderZones(); markDirty(); preflight();
}

function setStart(lat, lon) {
  S.start = { lat, lon };
  if (typeof paintEnds === 'function') setTimeout(paintEnds, 0);
  if (startMarker) map.removeLayer(startMarker);
  startMarker = L.marker([lat, lon], { draggable: true, icon: pin('🏁', '#4da3ff'), zIndexOffset: 900 })
    .addTo(map).bindTooltip(T('m_start'));
  startMarker.on('dragend', ev => {
    const p = ev.target.getLatLng(); S.start = { lat: p.lat, lon: p.lng }; preflight();
  });
  preflight();
}

function setFinish(lat, lon) {
  S.finish = { lat, lon };
  if (typeof paintEnds === 'function') setTimeout(paintEnds, 0);
  if (finishMarker) map.removeLayer(finishMarker);
  finishMarker = L.marker([lat, lon], { draggable: true, icon: pin('🏆', '#f0883e'), zIndexOffset: 900 })
    .addTo(map).bindTooltip(T('m_finish'));
  finishMarker.on('dragend', ev => {
    const p = ev.target.getLatLng(); S.finish = { lat: p.lat, lon: p.lng }; preflight();
  });
  preflight();
}

// ── Zonas: mover, redimensionar y renombrar sobre el mapa ────────────────
function metersToLatLng(lat, lon, dx, dy) {
  return [lat + dy / 111320, lon + dx / (111320 * Math.cos(lat * Math.PI / 180))];
}
function latLngDistance(a, b) {
  const dy = (b.lat - a.lat) * 111320;
  const dx = (b.lng - a.lng) * 111320 * Math.cos(a.lat * Math.PI / 180);
  return Math.hypot(dx, dy);
}

const HANDLE_PX = 9;          // radio de agarre del tirador, en píxeles

function drawZones() {
  zoneLayer.clearLayers();
  S.zoneLayers = {};
  S.zones.forEach(z => {
    const color = z.behavior === 'mandatory' ? '#3fb950' : '#f85149';
    // `interactive:false` es la clave: si el círculo captura el ratón, Leaflet
    // se traga el mousedown y no hay forma de arrastrar. Con el círculo inerte,
    // el arrastre lo gobierna el mapa y nosotros hacemos el hit-test.
    const circle = L.circle([z.lat, z.lon], {
      radius: z.buffer_m, color, weight: 2, fillColor: color, fillOpacity: 0.14,
      dashArray: z.behavior === 'forbidden' ? '6,5' : null, interactive: false,
    }).addTo(zoneLayer);
    const dot = L.circleMarker([z.lat, z.lon], {
      radius: 4, color: '#0b1220', weight: 2, fillColor: '#fff', fillOpacity: 1,
      interactive: false,
    }).addTo(zoneLayer);
    const handle = L.circleMarker(metersToLatLng(z.lat, z.lon, z.buffer_m, 0), {
      radius: 5, color: '#0b1220', weight: 2, fillColor: color, fillOpacity: 1,
      interactive: false,
    }).addTo(zoneLayer);
    S.zoneLayers[z.id] = { circle, dot, handle, z };
  });
}

function zoneHitTest(latlng, containerPoint) {
  // Devuelve {zone, kind} donde kind ∈ 'resize' | 'move'. El tirador gana al
  // cuerpo, y las zonas pequeñas ganan a las grandes (si no, una zona enorme
  // impediría tocar una pequeña que esté dentro).
  let best = null;
  for (const z of S.zones) {
    const hp = map.latLngToContainerPoint(metersToLatLng(z.lat, z.lon, z.buffer_m, 0));
    if (Math.hypot(hp.x - containerPoint.x, hp.y - containerPoint.y) <= HANDLE_PX + 3)
      return { zone: z, kind: 'resize' };
  }
  for (const z of S.zones) {
    const d = latLngDistance({ lat: z.lat, lng: z.lon }, latlng);
    if (d <= z.buffer_m && (!best || z.buffer_m < best.zone.buffer_m))
      best = { zone: z, kind: 'move' };
  }
  return best;
}

function wireZoneDragging() {
  const container = map.getContainer();

  map.on('mousedown', ev => {
    const hit = zoneHitTest(ev.latlng, ev.containerPoint);
    if (!hit) return;
    S.drag = {
      ...hit, moved: false,
      offLat: ev.latlng.lat - hit.zone.lat,
      offLon: ev.latlng.lng - hit.zone.lon,
    };
    map.dragging.disable();
    container.style.cursor = hit.kind === 'resize' ? 'ew-resize' : 'move';
    L.DomEvent.stop(ev.originalEvent);
  });

  map.on('mousemove', ev => {
    if (!S.drag) {
      // Sin arrastre en curso, el cursor anticipa qué haría un clic aquí.
      const hit = zoneHitTest(ev.latlng, ev.containerPoint);
      container.style.cursor = hit
        ? (hit.kind === 'resize' ? 'ew-resize' : 'move')
        : (S.mode === 'start' ? '' : 'crosshair');
      updateMapHud(ev.latlng);
      return;
    }
    const { zone, kind } = S.drag;
    S.drag.moved = true;
    const L2 = S.zoneLayers[zone.id];
    if (kind === 'move') {
      zone.lat = ev.latlng.lat - S.drag.offLat;
      zone.lon = ev.latlng.lng - S.drag.offLon;
      L2.circle.setLatLng([zone.lat, zone.lon]);
      L2.dot.setLatLng([zone.lat, zone.lon]);
      L2.handle.setLatLng(metersToLatLng(zone.lat, zone.lon, zone.buffer_m, 0));
    } else {
      const r = Math.max(50, Math.min(3000, Math.round(
        latLngDistance({ lat: zone.lat, lng: zone.lon }, ev.latlng) / 25) * 25));
      zone.buffer_m = r;
      L2.circle.setRadius(r);
      L2.handle.setLatLng(metersToLatLng(zone.lat, zone.lon, r, 0));
    }
    L.DomEvent.stop(ev.originalEvent);
  });

  const endDrag = () => {
    if (!S.drag) return;
    const moved = S.drag.moved;
    S.drag = null;
    map.dragging.enable();
    container.style.cursor = '';
    if (moved) { renderZones(); markDirty(); preflight(); }
    // Un arrastre no debe crear una zona nueva: se marca para que el `click`
    // posterior de Leaflet lo ignore.
    S.suppressClick = moved;
    setTimeout(() => { S.suppressClick = false; }, 60);
  };
  map.on('mouseup', endDrag);
  container.addEventListener('mouseleave', () => { hideMapHud(); endDrag(); });

  // Doble clic sobre una zona → renombrar (en vez de hacer zoom).
  map.on('dblclick', ev => {
    const hit = zoneHitTest(ev.latlng, ev.containerPoint);
    if (!hit) return;
    L.DomEvent.stop(ev.originalEvent);
    const nn = prompt(T('rename_zone'), hit.zone.name);
    if (nn && nn.trim()) { hit.zone.name = nn.trim(); renderZones(); markDirty(); }
  });
}

function renderZones() {
  const el = $('zoneList');
  if (!S.zones.length) { el.innerHTML = `<div class="hint">${T('no_zones')}</div>`; return; }
  el.innerHTML = S.zones.map(z => `
    <div class="zone" data-z="${z.id}">
      <div class="dot" style="background:${z.behavior === 'mandatory' ? '#3fb950' : '#f85149'}"></div>
      <div class="nm" data-rn="${z.id}" title="${T('rename_zone')}">${z.name}</div>
      <div style="color:var(--tx3);font-size:10.5px">${z.buffer_m} m</div>
      <div class="rm" data-rm="${z.id}">×</div>
    </div>`).join('');

  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    S.zones = S.zones.filter(z => z.id !== b.dataset.rm);
    drawZones(); renderZones(); markDirty(); preflight();
  });
  // Doble clic sobre el nombre → editar en el mismo sitio
  el.querySelectorAll('[data-rn]').forEach(nm => nm.ondblclick = () => {
    const z = S.zones.find(x => x.id === nm.dataset.rn);
    const inp = document.createElement('input');
    inp.className = 'rn'; inp.value = z.name;
    nm.replaceWith(inp); inp.focus(); inp.select();
    const commit = () => {
      if (inp.value.trim()) z.name = inp.value.trim();
      drawZones(); renderZones(); preflight();
    };
    inp.onblur = commit;
    inp.onkeydown = e => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') renderZones();
    };
  });
  el.querySelectorAll('[data-z]').forEach(row => row.onclick = e => {
    if (e.target.dataset.rm || e.target.dataset.rn) return;
    const z = S.zones.find(x => x.id === row.dataset.z);
    if (z) map.setView([z.lat, z.lon], Math.max(map.getZoom(), 14));
  });
}

// ══════════════════════════════════════════════════════════════════════════
// Lectura bajo el cursor
// ══════════════════════════════════════════════════════════════════════════
function fmtCoord(v, pos, neg) {
  return `${Math.abs(v).toFixed(4)}° ${v >= 0 ? pos : neg}`;
}

function updateMapHud(latlng) {
  const hud = $('maphud');
  if (!hud) return;
  const rows = [];

  // ¿Está el cursor sobre alguna ruta visible? Es la información más útil, así que
  // tiene prioridad y se muestra EXACTAMENTE la misma lectura que el perfil de
  // elevación: kilómetro de carrera, altitud y pendiente.
  const onRoute = nearestOnRoute(latlng);
  if (onRoute) {
    const g = gradientAt(onRoute.pts, onRoute.d);
    if (onRoute.label) rows.push(`<span style="color:${onRoute.color}">${onRoute.label}</span>`);
    rows.push(`<b>${fmt(toU(onRoute.d), 2)} ${uLabel()}</b> ${T('hud_km')}`);
    rows.push(`${fmt(g.elev)} m · ${g.grade >= 0 ? '+' : ''}${g.grade.toFixed(1)} %`);
    if (S.profilePts && S.profilePts.routeId === onRoute.routeId)
      showProfileCursor(onRoute.d);
    markRouteAt(onRoute.d, onRoute.routeId);
  } else {
    if (routeCursor) { routeLayer.removeLayer(routeCursor); routeCursor = null; }
    hideProfileCursor();
    if (S.start) {
      const d = latLngDistance({ lat: S.start.lat, lng: S.start.lon }, latlng);
      rows.push(`<b>${fmt(toU(d), 2)} ${uLabel()}</b> ${T('hud_to_start')}`);
    }
    if (S.finish) {
      const d = latLngDistance({ lat: S.finish.lat, lng: S.finish.lon }, latlng);
      rows.push(`<b>${fmt(toU(d), 2)} ${uLabel()}</b> ${T('hud_to_finish')}`);
    }
  }
  rows.push(`${fmtCoord(latlng.lat, 'N', 'S')}  ${fmtCoord(latlng.lng, 'E', 'W')}`);
  hud.innerHTML = rows.join('<br>');
  hud.classList.add('on');
}

function hideMapHud() {
  const hud = $('maphud');
  if (hud) hud.classList.remove('on');
  hideProfileCursor();
}

function wireMapHover() {
  map.on('mouseout', hideMapHud);
}

// Perfil acumulado de UNA ruta, cacheado por id. Antes la lectura bajo el cursor
// dependía de `S.profilePts`, que solo existe para la ruta cuyo perfil se está
// dibujando: pasar el ratón por una alternativa no decía nada.
function geomOf(rt) {
  if (!rt) return null;
  const hit = S.geomCache[rt.route_id];
  if (hit && hit.n === rt.coordinates.length) return hit.pts;
  const pts = cumulativeProfile(rt.coordinates);
  S.geomCache[rt.route_id] = { n: rt.coordinates.length, pts };
  return pts;
}

// Cualquier ruta VISIBLE cuenta, no solo la del perfil.
function hoverableRoutes() {
  const routes = allRoutes();
  return routes.map((rt, i) => ({ rt, i }))
    .filter(({ rt }) => S.visible.has(rt.route_id));
}

function nearestOnRoute(latlng, maxPx = 16) {
  const p = map.latLngToContainerPoint(latlng);
  let best = null;
  for (const { rt, i } of hoverableRoutes()) {
    const c = rt.coordinates;
    if (!c || c.length < 2) continue;
    // Muestreo: comprobar 1 de cada N puntos basta para un umbral de 16 px.
    const step = Math.max(1, Math.floor(c.length / 900));
    for (let k = 0; k < c.length; k += step) {
      const q = map.latLngToContainerPoint([c[k][1], c[k][0]]);
      const d2 = (q.x - p.x) ** 2 + (q.y - p.y) ** 2;
      if (!best || d2 < best.d2) best = { d2, k, rt, i };
    }
  }
  if (!best || Math.sqrt(best.d2) > maxPx) return null;
  const pts = geomOf(best.rt);
  const label = S.draw.on && best.rt.route_id === (S.draw.state && S.draw.state.route
      && S.draw.state.route.route_id)
    ? T('d_manual')
    : (best.i === 0 ? T('recommended') : T('alternative') + ' ' + best.i);
  return {
    d: pts[Math.min(best.k, pts.length - 1)][0], i: best.k, pts,
    routeId: best.rt.route_id, label,
    color: PALETTE[best.i % PALETTE.length],
  };
}

function markRouteAt(d, routeId) {
  const routes = allRoutes();
  const rt = routes.find(r => r.route_id === routeId)
    || routes.find(r => r.route_id === S.profileOf) || routes[0];
  if (!rt) return;
  const pts = geomOf(rt);
  let lo = 0, hi = pts.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (pts[m][0] < d) lo = m + 1; else hi = m; }
  const c = rt.coordinates[Math.min(lo, rt.coordinates.length - 1)];
  if (!c) return;
  if (routeCursor) routeLayer.removeLayer(routeCursor);
  routeCursor = L.circleMarker([c[1], c[0]], {
    radius: 5, color: '#0b1220', weight: 2, fillColor: '#fff', fillOpacity: 1,
    interactive: false,
  }).addTo(routeLayer);
}

// ══════════════════════════════════════════════════════════════════════════
// Modo creativo — trazado manual
// ══════════════════════════════════════════════════════════════════════════
// El estado vive aquí y el servidor es sin estado: cada llamada lleva la lista
// completa de nodos y aristas. Deshacer es entonces recortar la lista propia y
// pedir reevaluación, sin sesiones ni bloqueos en el backend.
const DRAW_ID = 'manual';

function setDrawMode(on) {
  S.draw.on = on;
  $('drawBar').style.display = on ? 'flex' : 'none';
  $('drawMsg').style.display = 'none';
  $('btnGen').disabled = on;
  if (on) {
    if (!S.draw.saved) S.draw.saved = S.result;
    if (!S.start) drawMsg(T('d_empty'), 'warn');
    else drawMsg(T('d_hint'), 'ok');
    S.result = null;
    renderDraw();
    redrawRoutes(false);
    // Si ya había un trazado en esta carrera, se recupera tal cual: los índices
    // de nodo bastan para que el servidor devuelva la misma geometría.
    if (S.draw.edges.length) {
      drawPost('/api/draw/state', { nodes: S.draw.nodes, edges: S.draw.edges })
        .then(r => { if (r && r.route) drawApply(r); }).catch(() => {});
    }
  } else {
    S.result = S.draw.saved || null;
    S.draw.saved = null;
    S.shownRoute = null; S.profileOf = null;
    if (S.result) renderResult(S.result);
    else { $('result').style.display = 'none'; $('placeholder').style.display = 'block'; }
    redrawRoutes(false);
  }
}

function drawMsg(text, kind) {
  const box = $('drawMsg');
  box.style.display = 'block';
  box.innerHTML = `<div class="msg ${kind || 'err'}">${text}</div>`;
}

function drawReset() {
  S.draw.nodes = []; S.draw.edges = []; S.draw.legs = [];
  S.draw.closed = false; S.draw.state = null;
  delete S.geomCache[DRAW_ID];
  S.result = null;
  renderDraw();
  redrawRoutes(false);
}

async function drawPost(path, body) {
  const res = await fetch(path, { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ constraints: buildModel() }, body)) });
  return res.json();
}

async function drawClick(latlng) {
  if (!S.start) { drawMsg(T('d_empty'), 'warn'); return; }
  const before = { n: S.draw.nodes.length, e: S.draw.edges.length };
  const r = await drawPost('/api/draw/extend', {
    nodes: S.draw.nodes, edges: S.draw.edges, lat: latlng.lat, lon: latlng.lng });
  if (!r.ok) { drawMsg((r.reason && r.reason.i18n && r.reason.i18n[S.lang]) || '—'); return; }
  S.draw.legs.push(before);
  drawApply(r);
}

async function drawClose() {
  if (S.draw.nodes.length < 2) { drawMsg(T('d_empty'), 'warn'); return; }
  const before = { n: S.draw.nodes.length, e: S.draw.edges.length };
  const r = await drawPost('/api/draw/extend', {
    nodes: S.draw.nodes, edges: S.draw.edges, close: true });
  if (!r.ok) { drawMsg((r.reason && r.reason.i18n && r.reason.i18n[S.lang]) || '—'); return; }
  S.draw.legs.push(before);
  drawApply(r);
}

async function drawUndo() {
  const cut = S.draw.legs.pop();
  if (!cut) { drawReset(); return; }
  S.draw.nodes = S.draw.nodes.slice(0, cut.n);
  S.draw.edges = S.draw.edges.slice(0, cut.e);
  S.draw.closed = false;
  $('drawMsg').style.display = 'none';
  if (S.draw.edges.length === 0) { drawReset(); return; }
  const r = await drawPost('/api/draw/state', {
    nodes: S.draw.nodes, edges: S.draw.edges });
  drawApply(r);
}

function drawApply(r) {
  $('drawMsg').style.display = 'none';
  S.draw.nodes = r.nodes; S.draw.edges = r.edges;
  S.draw.closed = !!r.closed; S.draw.state = r;
  delete S.geomCache[DRAW_ID];
  if (r.route) {
    // route_id estable: si cambiara en cada clic, `renderResult` creería que es
    // una ruta nueva y re-encuadraría el mapa en cada trazo.
    r.route.route_id = DRAW_ID;
    S.visible.add(DRAW_ID); S.profileOf = DRAW_ID; S.shownRoute = DRAW_ID;
    S.result = {
      recommended: r.route, alternatives: [], stage: 'manual', elapsed_ms: 0,
      log: [], seed: '—', graph_version: '', engine_version: '', manual: true,
    };
    renderResult(S.result);
  }
  renderDraw();
  markDirty();
}

function renderDraw() {
  const st = S.draw.state;
  const parts = [];
  if (!st || !st.distance_m) {
    parts.push(T('d_empty'));
  } else {
    parts.push(`<b>${dist(st.distance_m, 2)}</b> ${T('d_drawn')}`);
    if (st.return_m != null && !S.draw.closed)
      parts.push(`${T('d_back')} ${dist(st.return_m, 2)}`);
    parts.push(`${T('d_left')} ${dist(Math.max(0, st.remaining_m), 2)}`);
    if (st.gain_m) parts.push(`+${fmt(st.gain_m)} m`);
    if (S.draw.closed) parts.push(`<span class="badge b-ok">${T('d_closed')}</span>`);
  }
  $('drawRead').innerHTML = parts.join(' · ');
  $('btnDrawUndo').disabled = !S.draw.legs.length;
  $('btnDrawClose').disabled = S.draw.nodes.length < 2 || S.draw.closed;
}

// ══════════════════════════════════════════════════════════════════════════
// Modelo
// ══════════════════════════════════════════════════════════════════════════
function buildModel() {
  const gain = +$('gain').value, grade = +$('grade').value;
  const mc = $('maxCross').value.trim(), ml = $('maxLights').value.trim();
  const open = $('shape').value === 'open';
  const rango = S.distMode === 'range';
  const libre = S.distMode === 'free';
  const rmin = Math.min(+$('rmin').value, +$('rmax').value);
  const rmax = Math.max(+$('rmin').value, +$('rmax').value);
  const gT = +$('gainTarget').value;
  // Sin salida fijada, el modelo no valida y CUALQUIER llamada que lo lleve
  // devuelve un 422: el preflight, el re-puntuado conjunto, la importación. El
  // centro de la región es un valor por defecto defendible y se sustituye en
  // cuanto el usuario pincha. Generar sigue exigiendo una salida de verdad.
  const region0 = selectedRegions()[0];
  const salida = S.start || (region0 ? { lat: region0.lat, lon: region0.lon } : null);
  return {
    region: $('region').value,
    discipline: S.discipline,
    start: salida,
    finish: open ? (S.finish || salida) : null,
    distance: { target_m: rango ? Math.round((rmin + rmax) / 2) : +$('dist').value,
                tolerance_pct: +$('tol').value,
                mode: libre ? 'free' : (rango ? 'range' : 'target'),
                range_min_m: rango ? rmin : 0, range_max_m: rango ? rmax : 0,
                unit: 'km', measurement: $('measurement').value },
    routetype: { shape: open ? 'open' : 'circuit', start_equals_finish: !open,
                 laps: +$('laps').value,
                 allow_segment_reuse: $('reuse').checked },
    elevation: { enabled: $('elevOn').checked, max_gain_m: gain > 0 ? gain : null,
                 max_gradient_pct: grade > 0 ? grade : null,
                 // Con un desnivel BUSCADO puesto, preferir lo llano es la orden
                 // contraria. Se desactiva sola en vez de dejar que se peleen.
                 prefer_flatter: gT > 0 ? false : $('flatter').checked,
                 target_gain_m: gT > 0 ? gT : null },
    geometry: { search_radius_max_m: +$('radius').value, smoothness: +$('smooth').value,
                max_uturns: +$('uturn').value },
    intersections: { max_crossings: mc === '' ? null : +mc,
                     max_traffic_lights: ml === '' ? null : +ml, penalize_crossings: true },
    streets: { avoid_private: $('private').checked },
    logistics: { minimize_closures: $('closures').checked,
                 prioritize_wide_streets: $('wide').checked,
                 field_size: $('fieldSize').value.trim() === ''
                   ? null : +$('fieldSize').value },
    experience: { prioritize_parks: $('parks').checked, avoid_tunnels: $('tunnels').checked },
    zones: S.zones.map(z => ({ id: z.id, name: z.name, behavior: z.behavior,
      geometry: { type: 'Point', coordinates: [z.lon, z.lat] }, buffer_m: z.buffer_m })),
    objective: $('objective').value,
    reproducible: $('repro').checked,
    lang: S.lang,
    fast_budget_ms: 3000,
    total_budget_ms: +$('budget').value * 1000,
  };
}

// ══════════════════════════════════════════════════════════════════════════
// Disciplina — la primera decisión, y la que más cambia
// ══════════════════════════════════════════════════════════════════════════
const DISCIPLINES = ['running', 'trail', 'hiking', 'road', 'gravel', 'mtb'];

function renderDisciplines() {
  $('disciplines').innerHTML = DISCIPLINES.map(d =>
    `<div class="chip ${d === S.discipline ? 'on' : ''}" data-d="${d}">${
      T('disc_' + d)}</div>`).join('');
  document.querySelectorAll('#disciplines .chip').forEach(c =>
    c.onclick = () => setDiscipline(c.dataset.d));
  $('disciplineHint').textContent = T('disc_hint_' + S.discipline);
}

function setDiscipline(d) {
  if (!DISCIPLINES.includes(d)) return;
  const antes = isCycling();
  S.discipline = d;
  localStorage.setItem('re_disc', d);
  document.body.classList.toggle('cycling', isCycling());
  renderDisciplines();
  // Los presets cambian con la disciplina: un 10K y una marcha de 180 km no
  // compiten por el mismo hueco, y enseñarlos juntos obliga a descartar la
  // mitad de la lista en cada visita.
  loadPresets();
  // El trayecto es para rutas que NO caben en una ciudad: bici y monte. En un
  // 10K urbano no pinta nada, y tenerlo ahí sólo añade un botón que no se usa.
  const largo = isCycling() || OFFROAD.includes(S.discipline);
  $('btnModeCorr').style.display = largo ? '' : 'none';
  $('corridorFinder').style.display = largo ? '' : 'none';
  if (!largo && S.mode === 'corridor') setMode('pan');
  if (antes !== isCycling()) {
    // Cambiar de deporte cambia el mundo: lo generado antes ya no describe éste.
    if (S.result) { clearResult(); status(T('ready'), 'ready'); }
  }
  // Fuera del asfalto urbano, la distancia exacta casi nunca es la pregunta. Una
  // ruta de bici o de monte se plantea por dónde pasa y cuánto sube, y arrancar
  // pidiendo kilómetros exactos obliga a desactivarlo antes de empezar.
  if (!S.distModeTocado) S.distMode = largo ? 'free' : 'target';
  syncLabels(); markDirty(); preflight();
}

// ══════════════════════════════════════════════════════════════════════════
// Corredor — una franja a lo largo de un trayecto
// ══════════════════════════════════════════════════════════════════════════
// Una ruta de 150 km no cabe en «un círculo alrededor de un punto»: el círculo
// que la contuviera tendría 75 km de radio y descargaría sobre todo sitios por
// los que la ruta no pasa. Aquí se dibuja el trayecto y se descarga su franja.
function corrAdd(latlng) {
  S.corr.pts.push([+latlng.lat.toFixed(5), +latlng.lng.toFixed(5)]);
  corrRefresh();
}

function corrUndo() { S.corr.pts.pop(); corrRefresh(); }

function corrClear() {
  S.corr.pts = []; S.corr.preview = null;
  corrDraw(); corrPaint(); corrBarPaint();
}

let corrTimer = null;
function corrBarPaint() {
  const bar = $('corrBar');
  if (!bar) return;
  bar.style.display = S.mode === 'corridor' ? '' : 'none';
  const n = S.corr.pts.length;
  const p = S.corr.preview;
  $('corrRead').textContent = n < 2
    ? T('corr_need').replace('{n}', Math.max(0, 2 - n))
    : `${n} ${T('corr_points')} · ${p ? fmt(p.length_km, 1) + ' km' : '…'}`;
  $('btnCorrUndo2').disabled = !n;
  $('btnCorrClear2').disabled = !n;
  $('btnCorrDone').disabled = !(p && p.ok);
}

function corrRefresh() {
  corrDraw(); corrPaint(); corrBarPaint();
  clearTimeout(corrTimer);
  if (S.corr.pts.length < 2) { S.corr.preview = null; return; }
  corrTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/regions/corridor/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: 'x', points: S.corr.pts,
                               buffer_m: +$('corrBuf').value }),
      });
      S.corr.preview = await r.json();
    } catch (e) { S.corr.preview = null; }
    corrDraw(); corrPaint(); corrBarPaint();
  }, 260);
}

function corrDraw() {
  if (S.corr.layer) { map.removeLayer(S.corr.layer); S.corr.layer = null; }
  if (!S.corr.pts.length) return;
  const g = L.layerGroup();
  const p = S.corr.preview;
  if (p && p.ring && p.ring.length > 2) {
    L.polyline([...p.ring.map(c => [c[0], c[1]]), [p.ring[0][0], p.ring[0][1]]],
      { color: '#3fb950', weight: 2, opacity: .85, dashArray: '6 5',
        interactive: false }).addTo(g);
  }
  L.polyline(S.corr.pts.map(c => [c[0], c[1]]),
    { color: '#3fb950', weight: 3, opacity: .95, interactive: false }).addTo(g);
  S.corr.pts.forEach((c, i) => L.circleMarker([c[0], c[1]], {
    radius: 5, color: '#04121f', weight: 2, fillColor: '#3fb950', fillOpacity: 1,
    interactive: false,
  }).addTo(g));
  S.corr.layer = g.addTo(map);
}

function corrPaint() {
  const n = S.corr.pts.length;
  const p = S.corr.preview;
  const box = $('corrInfo');
  if (!box) return;
  if (n < 2) {
    box.innerHTML = `<div class="hint" style="margin-top:7px">${
      T('corr_need').replace('{n}', Math.max(0, 2 - n))}</div>`;
    $('btnCorrBuild').disabled = true;
    return;
  }
  if (!p) { box.innerHTML = `<div class="hint" style="margin-top:7px">…</div>`; return; }
  if (p.detail) {
    box.innerHTML = `<div class="msg err" style="margin-top:7px">${p.detail}</div>`;
    $('btnCorrBuild').disabled = true;
    return;
  }
  const ahorro = p.circle_area_km2 > 0
    ? Math.round(100 * (1 - p.area_km2 / p.circle_area_km2)) : 0;
  box.innerHTML = `<div class="verdict ${p.ok ? 'ok' : 'bad'}" style="margin-top:7px">
    <b>${fmt(p.length_km, 1)} km · ${T('corr_strip')} ${fmt(p.area_km2)} km²</b>
    ${fill('corr_saving', {c: fmt(p.circle_area_km2), p: ahorro})}
    ${p.ok ? '' : '<br>' + T('corr_too_big')
        .replace('{k}', fmt(p.max_length_km)).replace('{a}', fmt(p.max_area_km2))}</div>`;
  $('btnCorrBuild').disabled = !p.ok;
}

// Descargar la franja no es el final: es el principio. Lo que el usuario quiere
// es «de San Vicente a Rapel en bici», y para eso hacen falta cuatro cosas más
// —seleccionar la región, poner punto a punto, fijar salida y meta, y una
// distancia con sentido— que antes había que adivinar una por una.
function corrAdopt(regionId) {
  const pts = S.corr.pts;
  if (pts.length < 2) return;
  if (regionId) setRegionSel([regionId]);
  $('shape').value = 'open';
  setStart(pts[0][0], pts[0][1]);
  setFinish(pts[pts.length - 1][0], pts[pts.length - 1][1]);

  // Distancia: la del trayecto marcado, con holgura. Un recorrido por carretera
  // siempre mide más que la recta entre puntos, así que la horquilla va de lo
  // marcado a un 40 % más — y el usuario la ajusta desde ahí.
  const km = (S.corr.preview && S.corr.preview.length_km) || 0;
  if (km > 0) {
    S.distMode = 'range';
    $('rmin').value = Math.max(1000, Math.round(km * 1000));
    $('rmax').value = Math.min(300000, Math.round(km * 1400));
    $('dist').value = Math.round(km * 1200);
    $('radius').value = Math.min(150000, Math.max(5000, Math.round(km * 700)));
  }
  setMode('pan');
  syncLabels(); markDirty(); preflight();
