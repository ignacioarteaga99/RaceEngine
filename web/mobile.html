// ══════════════════════════════════════════════════════════════════════════
// Importar un recorrido existente
// ══════════════════════════════════════════════════════════════════════════
// Un error de validación de FastAPI llega como LISTA de objetos en `detail`.
// Concatenarlo sin más pintaba «[object Object]», que es la peor forma de fallar:
// se ve que algo se rompió y no se puede saber qué.
function errText(d) {
  if (!d) return '';
  if (typeof d.error === 'string' && d.error) return d.error;
  const det = d.detail;
  if (typeof det === 'string') return det;
  if (Array.isArray(det)) {
    return det.map(e => {
      const campo = Array.isArray(e.loc) ? e.loc.filter(x => x !== 'body').join('.') : '';
      return campo ? `${campo}: ${e.msg}` : (e.msg || JSON.stringify(e));
    }).join(' · ');
  }
  if (det && typeof det === 'object') return JSON.stringify(det);
  return '';
}

async function importTrack(file) {
  const box = $('importState');
  const ocupado = (txt) => {
    box.innerHTML = `<div class="msg warn" style="margin-top:6px"><b>${txt}</b>
      <div class="pbar indet"><div></div></div></div>`;
  };
  [$('btnImport'), $('btnImportTop')].forEach(b => { if (b) b.disabled = true; });
  ocupado(T('import_reading'));
  let text;
  try {
    text = await file.text();
  } catch (e) {
    box.innerHTML = `<div class="msg err" style="margin-top:6px">${String(e)}</div>`;
    [$('btnImport'), $('btnImportTop')].forEach(b => { if (b) b.disabled = false; });
    return;
  }
  // Contar los puntos aquí es barato y convierte una espera muda en una espera
  // con cifra. El enganche pasa en el servidor y no se puede seguir paso a paso,
  // pero saber que son cuatro mil puntos explica por qué tarda.
  const n = (text.match(/<(trkpt|rtept|wpt)\b/g) || []).length
    || (text.match(/\[/g) || []).length;
  ocupado(fill('import_matching', {n: fmt(n)}));
  const res = await fetch('/api/routes/import', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    // Sin salida fijada, `buildModel()` manda `start: null`. Para una importación
    // eso no es un problema: la salida la define la traza y el motor la reancla.
    body: JSON.stringify({ constraints: buildModel(), content: text, name: file.name }),
  });
  const d = await res.json();
  [$('btnImport'), $('btnImportTop')].forEach(b => { if (b) b.disabled = false; });
  if (!d.ok || !d.route) {
    box.innerHTML = `<div class="msg err" style="margin-top:6px"><b>${
      T('import_fail')}</b>${errText(d)}</div>`;
    return;
  }
  // CONVIVE con lo generado, no lo sustituye. Antes reemplazaba `S.result`, así
  // que al importar el recorrido del año pasado desaparecía exactamente aquello
  // con lo que se quería comparar.
  d.route.route_id = IMPORT_ID;
  delete S.geomCache[IMPORT_ID];
  S.imported = { route: d.route, raw: d.raw_coordinates || [],
                 meta: d.imported || {}, name: file.name };
  S.visible.add(IMPORT_ID); S.profileOf = IMPORT_ID;
  await rescoreAll();
  renderNow(true);

  const im = S.imported.meta;
  const huecos = im.gaps ? `<br>${T('import_gaps').replace('{n}', im.gaps)}` : '';
  box.innerHTML = `<div class="msg ${im.matched_pct >= 90 ? 'ok' : 'warn'}"
      style="margin-top:6px"><b>${T('import_ok')} · ${file.name}</b>${
    T('import_meta').replace('{p}', im.matched_pct).replace('{d}', im.deviation_m)
    }${huecos}</div>`;
}

function dropImport() {
  S.imported = null;
  S.visible.delete(IMPORT_ID);
  if (S.profileOf === IMPORT_ID) S.profileOf = null;
  delete S.geomCache[IMPORT_ID];
  $('importState').innerHTML = '';
  rescoreAll().then(() => renderNow());
}

// Vuelve a puntuar TODO lo que está en pantalla en una sola normalización.
// Es la regla de doc 06 §4.2: lo que se enseña junto se puntúa junto. Sin esto,
// la ruta generada traía la escala de sus rivales del generador y la importada
// la suya propia, y el «61 contra 74» no comparaba nada.
async function rescoreAll() {
  const rutas = allRoutes().filter(r => (r.node_path || []).length > 1);
  if (!rutas.length) return;
  try {
    const res = await fetch('/api/routes/rescore', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ constraints: buildModel(), routes: rutas.map(r => ({
        route_id: r.route_id, nodes: r.node_path,
        generator: (r.provenance || {}).generator || '' })) }),
    });
    const d = await res.json();
    if (!d.ok) return;
    const por = {};
    d.routes.forEach(x => { por[x.route_id] = x; });
    rutas.forEach(r => {
      const n = por[r.route_id];
      if (!n) return;
      // Las MÉTRICAS también se rehacen, no solo la puntuación: cambiar los
      // inscritos o el modo de medición cambia lo que hay que medir, y dejar las
      // cifras viejas al lado de un veredicto nuevo era una incoherencia visible
      // (el panel decía «harían falta 0,0 m de ancho» con 3.000 dorsales puestos).
      // Excepción: con vueltas, la reutilización de tramos se conserva — repetir
      // una vuelta no es reutilizar, y recalcularla sobre el camino expandido
      // deshacía esa distinción.
      const reuso = r.metrics ? r.metrics.segment_reuse_pct : null;
      r.metrics = n.metrics;
      if (+$('laps').value > 1 && reuso != null) r.metrics.segment_reuse_pct = reuso;
      r.global_score = n.global_score;
      r.normalized = n.normalized;
      r.indices = n.indices;
      r.breakdown = n.breakdown;
      r.in_tolerance = n.in_tolerance;
      r.hard_violations = n.hard_violations;
      r.mandatory_missing = n.mandatory_missing;
      r.mandatory_covered = n.mandatory_covered;
    });
  } catch (e) { /* sin servidor: se quedan las escalas de origen */ }
}

// Exportación en el cliente para el trazado manual (mismo formato que el servidor).
function downloadManual(rt, kind) {
  let body, mime, name;
  if (kind === 'gpx') {
    const pts = rt.coordinates.map(c =>
      `      <trkpt lat="${c[1].toFixed(6)}" lon="${c[0].toFixed(6)}"><ele>${
        c[2].toFixed(1)}</ele></trkpt>`).join('\n');
    body = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="RaceEngine (manual)"
     xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>RaceEngine ${(rt.metrics.distance_m / 1000).toFixed(2)} km</name>
    <desc>Trazado manual · score ${rt.global_score.toFixed(1)}/100 · ` +
      `© OpenStreetMap contributors (ODbL)</desc>
  </metadata>
  <trk><name>RaceEngine manual</name><trkseg>
${pts}
  </trkseg></trk>
</gpx>
`;
    mime = 'application/gpx+xml'; name = 'raceengine_manual.gpx';
  } else {
    body = JSON.stringify({
      type: 'FeatureCollection',
      features: [{ type: 'Feature',
        geometry: { type: 'LineString', coordinates: rt.coordinates },
        properties: { route_id: rt.route_id, global_score: rt.global_score,
          distance_m: rt.metrics.distance_m, in_tolerance: rt.in_tolerance,
          generator: 'manual' } }],
      attribution: '© OpenStreetMap contributors (ODbL)',
    }, null, 2);
    mime = 'application/geo+json'; name = 'raceengine_manual.geojson';
  }
  const url = URL.createObjectURL(new Blob([body], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

window.__startApp = function () {
  initMap(); initUI(); setAdvanced(S.adv);
  document.body.classList.toggle('cycling', isCycling());
  applyLang();
  loadRegions(); loadPresets(); loadProjects();
};
window.__leafletLoader();

<button id="mGen" class="primary"></button>
<script>
/* ── Navegación móvil ───────────────────────────────────────────────────── */
(function () {
  var L10N = {
    es: { cfg: 'Ajustes', map: 'Mapa', res: 'Resultado', gen: '▶ Generar' },
    en: { cfg: 'Settings', map: 'Map', res: 'Result', gen: '▶ Generate' },
  };
  function lang() { try { return localStorage.getItem('re_lang') === 'en' ? 'en' : 'es'; } catch (e) { return 'es'; } }
  function labels() {
    var d = L10N[lang()];
    document.querySelectorAll('[data-ml]').forEach(function (el) { el.textContent = d[el.dataset.ml]; });
    document.getElementById('mGen').textContent = d.gen;
  }
  var cur = 'map';
  function show(m) {
    cur = m;
    document.body.classList.remove('m-cfg', 'm-map', 'm-res');
    document.body.classList.add('m-' + m);
    document.querySelectorAll('#mnav button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.m === m);
      if (b.dataset.m === m) b.classList.remove('new');
    });
    try { sessionStorage.setItem('re_mtab', m); } catch (e) {}
    // Leaflet mide el contenedor al crearse; si estaba oculto hay que avisarle.
    if (m === 'map' && typeof map !== 'undefined' && map && map.invalidateSize) setTimeout(function () { map.invalidateSize(); }, 30);
  }
  window.__mShow = show;
  document.querySelectorAll('#mnav button').forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.m); });
  });
  // «Generar» desde Ajustes: lanza y lleva al mapa para ver la ruta crecer.
  document.getElementById('mGen').addEventListener('click', function () {
    var g = document.getElementById('btnGen');
    if (g && !g.disabled) { show('map'); g.click(); }
  });
  var bg = document.getElementById('btnGen');
  if (bg) bg.addEventListener('click', function () { if (cur !== 'map') show('map'); });
  // Punto verde en «Resultado» cuando aparece un resultado nuevo.
  var res = document.getElementById('result');
  if (res) new MutationObserver(function () {
    if (res.style.display !== 'none' && cur !== 'res')
      document.querySelector('#mnav [data-m=res]').classList.add('new');
  }).observe(res, { attributes: true, attributeFilter: ['style'] });
  // Traducción de la barra si cambia el idioma.
  document.addEventListener('click', function () { setTimeout(labels, 0); }, true);
  window.addEventListener('resize', function () {
    if (cur === 'map' && typeof map !== 'undefined' && map && map.invalidateSize) map.invalidateSize();
  });
  labels();
  var start = 'map';
  try { start = sessionStorage.getItem('re_mtab') || 'map'; } catch (e) {}
  show(start);
})();
</script>
